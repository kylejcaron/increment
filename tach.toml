source_roots = ["."]
root_module = "ignore"
exact = true
ignore_type_checking_imports = true
forbid_circular_dependencies = true

[[modules]]
path = "increment._literals"
depends_on = []

[[modules]]
path = "increment._immutable"
depends_on = ["increment._display"]

[[modules]]
path = "increment"
depends_on = []
[[modules]]
path = "increment.errors"
depends_on = []
[[modules]]
path = "increment._multiplicity"
depends_on = ["increment._literals", "increment.errors", "increment.sequential_state"]

[[modules]]
path = "increment._finite_sample_refusals"
depends_on = ["increment.errors"]

[[modules]]
path = "increment.compatibility"
depends_on = ["increment.errors"]

[[modules]]
path = "increment.semantics"
depends_on = ["increment._finite_sample_refusals", "increment._immutable", "increment._literals", "increment.winsor", "increment.errors", "increment._canonical"]

[[modules]]
path = "increment._canonical"
depends_on = []

[[modules]]
path = "increment._identity"
depends_on = ["increment.errors"]

[[modules]]
path = "increment._display"
depends_on = []

[[modules]]
path = "increment._unit_cycle"
depends_on = ["increment._literals", "increment.errors", "increment.semantics"]

[[modules]]
path = "increment._window"
depends_on = ["increment.semantics", "increment.errors"]

[[modules]]
path = "increment._study"
depends_on = ["increment.semantics", "increment.errors"]

[[modules]]
path = "increment._policy_alpha"
depends_on = ["increment.compatibility"]

[[modules]]
path = "increment._source_operations"
depends_on = ["increment.errors"]

[[modules]]
path = "increment._plan_compatibility"
depends_on = ["increment._literals", "increment.errors"]

[[modules]]
path = "increment._compatibility_inspector"
depends_on = ["increment.compatibility", "increment.errors"]

[[modules]]
path = "increment.impute"
depends_on = ["increment.errors"]

[[modules]]
path = "increment.results"
depends_on = []

[[modules]]
path = "increment._labels"
depends_on = []

[[modules]]
path = "increment._source_types"
depends_on = ["increment._moment_plan", "increment.errors"]

[[modules]]
path = "increment.estimation.decision_types"
depends_on = [
  "increment._literals",
  "increment.errors", "increment.estimation._certified", "increment.estimation._sequential_likelihood",
  "increment.estimation.sequential_result", "increment.sequential_state",
  "increment.semantics",
]

# Numerical state and inference policy leaves must not depend on estimator dispatch.
[[modules]]
path = "increment.estimation._certified"
depends_on = ["increment.errors"]

[[modules]]
path = "increment.estimation._sequential_likelihood"
depends_on = ["increment._literals", "increment.errors", "increment.estimation._certified"]

[[modules]]
path = "increment.estimation._sequential_inversion"
depends_on = [
  "increment._literals",
  "increment.errors", "increment.estimation._certified", "increment._display",
  "increment.estimation._sequential_likelihood",
]

[[modules]]
path = "increment.estimation.asymptotic_mean"
depends_on = [
  "increment._literals",
  "increment.errors", "increment.estimation._certified",
  "increment.estimation._sequential_likelihood", "increment.semantics",
]

[[modules]]
path = "increment.estimation.asymptotic_joint"
depends_on = [
  "increment._literals",
  "increment.errors", "increment.estimation._sequential_likelihood",
  "increment.estimation.asymptotic_mean", "increment.semantics",
]

[[modules]]
path = "increment.estimation.sequential_result"
depends_on = [
  "increment.errors", "increment.estimation._certified",
  "increment.estimation._sequential_inversion", "increment.estimation._sequential_likelihood",
  "increment.estimation.asymptotic_joint", "increment.estimation.asymptotic_mean",
  "increment.semantics", "increment.sequential_state",
]

[[modules]]
path = "increment.estimation.sequential"
depends_on = ["increment.errors", "increment.semantics"]

[[modules]]
path = "increment.sequential_state"
depends_on = [
  "increment.errors", "increment.estimation._sequential_likelihood", "increment.semantics",
  "increment._immutable",
]

[[modules]]
path = "increment.sequential_source"
depends_on = [
  "increment._analysis_config",
  "increment.errors", "increment.estimation.asymptotic_mean", "increment.estimation.sequential",
  "increment.semantics", "increment.sequential_state",
    "increment._window",
]

[[modules]]
path = "increment._metric_specs"
depends_on = ["increment._finite_sample_refusals", "increment._literals", "increment.errors", "increment.estimation", "increment.semantics"]

# Shared source and decision types live in leaf modules, keeping the core
# decision/plan/source/request/config dependency graph acyclic.
[[modules]]
path = "increment.decision"
depends_on = [
  "increment._literals", "increment._multiplicity",
  "increment._plan_compatibility", "increment._source_types", "increment._study",
  "increment.compatibility", "increment.errors", "increment.estimation",
  "increment.estimation.decision_types", "increment.estimation.sequential", "increment.semantics",
  "increment.sequential_source", "increment.sequential_state",
]

[[modules]]
path = "increment.plan"
depends_on = [
  "increment._literals", "increment._multiplicity",
  "increment._analysis_config", "increment._plan_compatibility",
  "increment.decision", "increment.errors", "increment.estimation", "increment.semantics",
  "increment.estimation.sequential", "increment.sequential_source", "increment.sequential_state",
]
[[modules]]
path = "increment.decision_wire"
depends_on = [
  "increment._literals", "increment._multiplicity",
  "increment._immutable",
  "increment.compatibility", "increment.decision", "increment.errors", "increment.estimation",
  "increment.estimation.sequential", "increment.semantics",
  "increment.sequential_source", "increment.sequential_state",
]

[[modules]]
path = "increment._source_identity"
depends_on = ["increment._canonical"]

[[modules]]
path = "increment.sources"
depends_on = [
  "increment._source_identity",
  "increment.winsor",
  "increment.estimation.decision_types",
  "increment._analysis_config", "increment._labels", "increment._moment_plan", "increment._source_types",
  "increment.decision", "increment.decision_wire", "increment.errors", "increment.plan", "increment.semantics",
  "increment.sequential_source", "increment.sequential_state",
]

[[modules]]
path = "increment._readout_request"
depends_on = [
  "increment._analysis_config",
  "increment._literals",
  "increment.compatibility", "increment.errors", "increment.estimation",
  "increment.estimation.sequential", "increment.plan", "increment.semantics",
  "increment.sequential_source", "increment.sources",
]

[[modules]]
path = "increment._analysis_config"
depends_on = ["increment.estimation", "increment.semantics", "increment.errors"]

[[modules]]
path = "increment._moment_plan"
depends_on = []

[[modules]]
path = "increment.estimation._score_design"
depends_on = []

[[modules]]
path = "increment.estimation"
depends_on = [
  "increment._finite_sample_refusals",
  "increment._literals", "increment._multiplicity",
  "increment._identity",
  "increment._display", "increment._canonical", "increment._immutable",
  "increment._moment_plan",
  "increment._source_types", "increment._winsor_rank", "increment.winsor", "increment._labels", "increment._window", "increment.compatibility",
  "increment.errors", "increment.estimation._certified", "increment.estimation.decision_types",
  "increment.estimation._sequential_likelihood",
  "increment.estimation.sequential", "increment.estimation.sequential_result",
  "increment.semantics", "increment.sequential_state",
  "increment._unit_cycle",
  "increment.estimation._score_design",
]
[[modules]]
path = "increment._lift_options"
depends_on = ["increment._analysis_config", "increment.estimation"]

[[modules]]
path = "increment._frame_moments"
depends_on = ["increment._frame_panel", "increment._frame_validation", "increment._moment_plan", "increment._window", "increment.errors", "increment.semantics", "increment.sources"]


[[modules]]
path = "increment._frame_panel"
depends_on = ["increment._frame_validation", "increment._window", "increment.errors", "increment.sources"]

[[modules]]
path = "increment._frame_validation"
depends_on = ["increment._metric_specs", "increment.errors", "increment.estimation", "increment.plan", "increment.semantics", "increment.sources"]

[[modules]]
path = "increment._frame_sequential"
depends_on = [
  "increment._frame_moments", "increment._frame_panel",
  "increment.sequential_source", "increment.sequential_state",
]

[[modules]]
path = "increment.frame"
depends_on = [
  "increment._source_types",
  "increment._identity",
  "increment.winsor",
  "increment._analysis_config", "increment._frame_moments", "increment._frame_panel",
  "increment._frame_sequential", "increment._frame_validation", "increment._metric_specs", "increment._window",
  "increment.decision", "increment.errors", "increment.semantics",
  "increment.sequential_source", "increment.sequential_state",
  "increment.sources", "increment.switchback",
