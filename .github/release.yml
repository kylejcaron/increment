# Categories for the notes generated by `gh release create --generate-notes`.
changelog:
  exclude:
    labels: [skip-changelog, dependencies]
    authors: [dependabot, renovate, github-actions]
  categories:
    - title: Breaking changes
      labels: [breaking]
    - title: Features
      labels: [feature]
    - title: Fixes
      labels: [bug]
    - title: Documentation
      labels: [documentation]
    - title: Internal
      labels: [internal]
    - title: Other changes
      labels: ["*"]
