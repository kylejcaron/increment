# Categories for the notes generated by `gh release create --generate-notes`.
changelog:
  exclude:
    labels: [skip-changelog, dependencies]
    authors: [dependabot, renovate, github-actions]
  categories:
    - title: Breaking changes
      labels: [breaking]
    - title: Features
      labels: [feature, enhancement]
    - title: Fixes
      labels: [bug, fix]
    - title: Statistics and inference
      labels: [stats, inference]
    - title: Documentation
      labels: [documentation, docs]
    - title: Internal
      labels: [internal, refactor, ci]
    - title: Other changes
      labels: ["*"]
