name: cla

# Signatures are committed to the `cla-signatures` branch of this repo using
# the job's GITHUB_TOKEN, which is why `contents: write` below is required.
# No PAT is needed: the action only reaches for PERSONAL_ACCESS_TOKEN when
# `remote-repository-name`/`remote-organization-name` point the signature
# store at a different repo (see resolveSignaturesTarget in persistence.ts).
# If you later move signatures to a private kylejcaron/cla-signers repo, add
# those two inputs, drop `contents` back to `read`, and supply the PAT.

on:
  issue_comment: {types: [created]}
  pull_request_target: {types: [opened, closed, reopened, synchronize]}

concurrency:
  # Recording a signature is a read-modify-write on one JSON file guarded by a
  # SHA precondition; concurrent signings would race and one would 409.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: false

permissions: {}

jobs:
  cla:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
      contents: write
      pull-requests: write
      statuses: write
    # Write scopes on a pull_request_target job are safe only while nothing
    # here checks out or executes PR-controlled content. Don't add a checkout
    # or build step.
    steps:
      # Maintained fork of the archived contributor-assistant/github-action,
      # pinned by SHA because this job holds write scopes under
      # pull_request_target.
      - uses: iainmcgin/cla-github-action@0d27e5a16278d4adb6b0c4b92f08ad27b0a21dc8 # v3.2.0
        # Without this guard the action runs on every comment on every plain
        # issue, where there is no pull request to resolve, and fails the check.
        if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-document: https://github.com/kylejcaron/increment/blob/main/.github/CLA.md
          path-to-signatures: signatures/v1/cla.json
          branch: cla-signatures
          # AI coding agents add Co-authored-by trailers; they are counted as
          # committers but cannot comment to sign, so they must be allowlisted
          # or every agent-assisted PR blocks permanently.
          allowlist: kylejcaron,bot*,dependabot[bot],renovate[bot],copilot,Copilot,Codex,Cursor,noreply@anthropic.com,cursoragent@cursor.com,codex@openai.com
          # Fail the check when the PR opener authored none of the commits.
          require-opener-as-author: true
          lock-pullrequest-aftermerge: false
          custom-pr-sign-comment: I have read the CLA Document and I hereby sign the CLA
          custom-notsigned-prcomment: >
            Thanks for the pull request. Before it can be merged, please read
            the [Contributor License Agreement](https://github.com/kylejcaron/increment/blob/main/.github/CLA.md)
            and sign it by posting the comment below. You keep the copyright in
            your work; the CLA grants increment the right to license it,
            including commercially. You sign once and it covers all your future
            contributions.
          custom-allsigned-prcomment: CLA signed by all contributors. Thank you.
