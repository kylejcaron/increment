name: release

# Tag-driven release. `hatch-vcs` derives the version from the git tag, so the
# tag IS the version bump -- nothing writes a version string into a file.
#
#   .github/workflows/bump.yml  -> creates the vX.Y.Z tag and dispatches this workflow
#   this workflow               -> build, verify, publish to PyPI, GitHub Release,
#                                  then (opt-in, stable only) notify the docs website
#
# Publishing uses PyPI Trusted Publishing (OIDC). No API token is stored.
# One-time setup on PyPI (Account -> Publishing, as a "pending publisher" if the
# project does not exist yet):
#   owner: kylejcaron   repository: increment
#   workflow: release.yml   environment: pypi
# A pending publisher does NOT reserve the name; it is claimed on first publish.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      version: ${{ steps.check.outputs.version }}
      prerelease: ${{ steps.check.outputs.prerelease }}
      candidate_sha: ${{ steps.check.outputs.candidate_sha }}
      wheel_sha256: ${{ steps.hashes.outputs.wheel_sha256 }}
      sdist_sha256: ${{ steps.hashes.outputs.sdist_sha256 }}
    steps:
      - name: Require a version tag
        env:
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          case "$REF" in
            refs/tags/v*) ;;
            *) echo "::error::release requires a v* tag ref, not a branch"; exit 1 ;;
          esac

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # hatch-vcs reads tags to compute the version; a shallow clone yields
          # a bogus 0.1.dev0 instead of the real tag.
          fetch-depth: 0
          persist-credentials: false

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true

      - name: Verify checked-out candidate matches tag target
        env:
          EXPECTED_SHA: ${{ github.sha }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          checkout_sha="$(git rev-parse HEAD)"
          tag_sha="$(git rev-parse "refs/tags/$TAG^{commit}")"
          if [ "$checkout_sha" != "$EXPECTED_SHA" ] || [ "$tag_sha" != "$EXPECTED_SHA" ]; then
            echo "::error::tag, workflow SHA, and checked-out candidate must resolve to one commit"
            exit 1
          fi

      - run: uv build --sdist --wheel --out-dir dist

      - name: Verify built version matches the tag
        id: check
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          # Wheel filename is {name}-{version}-{python}-{abi}-{platform}.whl
          whl=$(ls dist/*.whl)
          built=$(basename "$whl" | cut -d- -f2)
          echo "tag=$tag built=$built"

          if [ "$tag" != "$built" ]; then
            echo "::error::tag v$tag does not match built version $built."
            echo "::error::Usually means the tag is not on the checked-out commit,"
            echo "::error::or the tree is dirty so hatch-vcs appended a dev/local segment."
            exit 1
          fi

          # PyPI rejects PEP 440 local versions outright ("Can't use PEP 440
          # local versions"), so fail here with a clear message rather than at
          # upload time after a release has already been tagged.
          case "$built" in
            *+*) echo "::error::version $built has a local segment; PyPI will reject it"; exit 1 ;;
          esac

          # a/b/rc/dev -> mark the GitHub Release as a prerelease
          if printf '%s' "$built" | grep -Eq '(a|b|rc|\.dev)[0-9]+'; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$built" >> "$GITHUB_OUTPUT"
          echo "candidate_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Check metadata renders on PyPI
        run: uvx twine check --strict dist/*

      - name: Verify artifacts actually contain the package
        shell: bash
        run: |
          set -euo pipefail
          # hatchling does NOT error when `packages = ["increment"]` points at a
          # directory that does not exist -- it builds a metadata-only wheel and
          # exits 0. Every other gate here passes on that wheel: the version
          # matches the tag and `twine check` only inspects metadata. Without
          # this step a mistagged or wrongly-checked-out build publishes an
          # empty package, and PyPI version numbers can never be reused.
          python3 - <<'PY'
          import glob, sys, tarfile, zipfile

          def one(pattern):
              hits = glob.glob(pattern)
              if not hits:
                  sys.exit(f"::error::no artifact matching {pattern} -- the build produced nothing")
              if len(hits) > 1:
                  sys.exit(f"::error::expected exactly one {pattern}, found {len(hits)}: {hits}")
              return hits[0]

          whl = one("dist/*.whl")
          mods = [n for n in zipfile.ZipFile(whl).namelist()
                  if n.startswith("increment/") and n.endswith(".py")]
          if not mods:
              sys.exit(f"::error::{whl} contains no increment/*.py modules -- "
                       "refusing to publish an empty wheel")
          print(f"wheel: {len(mods)} module(s)")

          sdist = one("dist/*.tar.gz")
          with tarfile.open(sdist) as tf:
              src = [n for n in tf.getnames()
                     if "/increment/" in n and n.endswith(".py")]
          if not src:
              sys.exit(f"::error::{sdist} contains no increment/ sources")
          print(f"sdist: {len(src)} module(s)")
          PY

      - name: Hash release artifacts
        id: hashes
        shell: bash
        run: |
          set -euo pipefail
          echo "wheel_sha256=$(sha256sum dist/*.whl | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "sdist_sha256=$(sha256sum dist/*.tar.gz | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  verify:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - name: Bind downloaded build artifacts to candidate
        env:
          EXPECTED_SHA: ${{ needs.build.outputs.candidate_sha }}
          WHEEL_SHA256: ${{ needs.build.outputs.wheel_sha256 }}
          SDIST_SHA256: ${{ needs.build.outputs.sdist_sha256 }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(sha256sum dist/*.whl | cut -d' ' -f1)" = "$WHEEL_SHA256"
          test "$(sha256sum dist/*.tar.gz | cut -d' ' -f1)" = "$SDIST_SHA256"

      - name: Build strict documentation
        run: uv run --with nox nox -s docs

      - name: Smoke installed candidate wheel and README mean example
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: uv run --with nox nox -s wheel_smoke -- --expected-version "$VERSION" --readme-example

      - name: Write and validate exact-candidate receipt
        env:
          SHA: ${{ needs.build.outputs.candidate_sha }}
          VERSION: ${{ needs.build.outputs.version }}
          WHEEL_SHA256: ${{ needs.build.outputs.wheel_sha256 }}
          SDIST_SHA256: ${{ needs.build.outputs.sdist_sha256 }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python - <<'PY'
          import json, os
          receipt = {
              "candidate_sha": os.environ["SHA"],
              "tag": os.environ["GITHUB_REF_NAME"],
              "version": os.environ["VERSION"],
              "wheel_sha256": os.environ["WHEEL_SHA256"],
              "sdist_sha256": os.environ["SDIST_SHA256"],
              "run_url": os.environ["RUN_URL"],
              "scope": ["strict-docs", "installed-wheel-readme-mean-analysis"],
              "docs": {"status": "success", "sha": os.environ["SHA"], "run_url": os.environ["RUN_URL"]},
              "readme_smoke": {"status": "success", "sha": os.environ["SHA"], "run_url": os.environ["RUN_URL"]},
              "unresolved": [
                  "Upstream ci-ok/legacy status checks are evaluated by bump.yml, not revalidated here; bump's explicit force input can bypass them."
              ],
              "deviations": [],
          }
          with open("release-receipt.json", "w", encoding="utf-8") as stream:
              json.dump(receipt, stream, indent=2)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write("## Exact-candidate release receipt\n\n```json\n")
              json.dump(receipt, summary, indent=2)
              summary.write("\n```\n")
          PY
          python scripts/release_receipt.py verify --receipt release-receipt.json --sha "$SHA"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-receipt
          path: release-receipt.json
          if-no-files-found: error

  pypi-smoke:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true

      - name: Install and smoke the exact PyPI version
        env:
          VERSION: ${{ needs.publish.outputs.version }}
        run: uv run --no-project --python 3.12 python scripts/pypi_release_smoke.py "$VERSION"

      - name: Report post-publication failure boundary
        if: failure()
        run: |
          echo "::error::PyPI publication already occurred; this smoke failed after publication. No rollback or republish was attempted."

  publish:
    needs: [build, verify]
    outputs:
      version: ${{ needs.build.outputs.version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Gate releases behind a protected environment so a pushed tag alone cannot
    # publish. Configure required reviewers on the `pypi` environment.
    environment:
      name: pypi
      url: https://pypi.org/project/increment/${{ needs.build.outputs.version }}
    permissions:
      # OIDC token for Trusted Publishing. This is the ONLY credential used.
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        # Signs each artifact with Sigstore and uploads the attestation
        # alongside it; on by default, pinned here so it is explicit.
        with:
          attestations: true
          print-hash: true

  github-release:
    needs: [build, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ needs.build.outputs.prerelease }}
        run: |
          set -euo pipefail
          args=(--verify-tag --generate-notes --title "$TAG")
          [ "$PRERELEASE" = "true" ] && args+=(--prerelease)
          gh release create "$TAG" "${args[@]}" dist/*

  # Post-publication notification is opt-in; publishing never depends on it.
  website-notify:
    needs: [build, github-release]
    if: needs.build.outputs.prerelease == 'false' && vars.DOCS_SYNC_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Mint website dispatch token
        id: docs-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510
        with:
          app-id: ${{ vars.DOCS_APP_ID }}
          private-key: ${{ secrets.DOCS_APP_PRIVATE_KEY }}
          owner: kylejcaron
          repositories: getincrement.io
          permission-contents: write

      - name: Notify website of the published release
        env:
          GH_TOKEN: ${{ steps.docs-token.outputs.token }}
          TAG: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          jq -n --arg tag "$TAG" --arg sha "$SHA" \
            '{event_type:"increment_release",client_payload:{tag:$tag,sha:$sha}}' \
            | gh api --method POST repos/kylejcaron/getincrement.io/dispatches --input -
