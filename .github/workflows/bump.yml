name: bump

# Calculate the version, create its tag, and explicitly dispatch release.yml.
# hatch-vcs owns the package version; no version file is written.

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Auto advances prerelease counters, or patch when stable"
        required: false
        default: auto
        type: choice
        options:
          - auto
          - patch
          - minor
          - major
      stage:
        description: "Keep the release stage or explicitly promote/change it"
        required: false
        default: keep-current
        type: choice
        options:
          - keep-current
          - alpha
          - beta
          - rc
          - stable
      version:
        description: "Exact PEP 440 override, without v; keep bump/stage defaults"
        required: false
        type: string
      dry_run:
        description: "Preview the selected version and check CI without tagging or releasing"
        required: false
        default: false
        type: boolean
      force:
        description: "Skip the CI gate for a prerelease (not recommended); refused for a stable version"
        required: false
        default: false
        type: boolean

concurrency:
  group: bump
  cancel-in-progress: false

permissions: {}

jobs:
  tag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      checks: read
      actions: write
      statuses: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true

      - name: Resolve release version
        id: version
        env:
          SHA: ${{ github.sha }}
          BUMP: ${{ inputs.bump }}
          STAGE: ${{ inputs.stage }}
          VERSION_OVERRIDE: ${{ inputs.version }}
        run: |
          set -euo pipefail
          resolved=$(uv run --no-project --python 3.12 --with packaging==26.2 \
            python scripts/next_version.py --ref "$SHA" --bump "$BUMP" \
            --stage "$STAGE" --version "$VERSION_OVERRIDE")
          version=$(printf '%s' "$resolved" | jq -er '.version')
          baseline=$(printf '%s' "$resolved" | jq -r '.baseline // "no reachable tag"')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          printf '### Release version\n\nBaseline: %s\nSelected: %s\n' \
            "$baseline" "$version" >> "$GITHUB_STEP_SUMMARY"

      - name: Refuse force for a stable version
        if: ${{ inputs.force }}
        env:
          SHA: ${{ github.sha }}
          VERSION: ${{ steps.version.outputs.version }}
          FORCE: ${{ inputs.force }}
        run: scripts/release_gate.sh

      - name: Require green checks on this commit
        if: ${{ !inputs.force }}
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          VERSION: ${{ steps.version.outputs.version }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/
        run: scripts/release_gate.sh

      - name: Report preview
        if: ${{ inputs.dry_run }}
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          echo "Preview complete: v$VERSION; no tag created or release dispatched." >> "$GITHUB_STEP_SUMMARY"

      - name: Create and push the tag
        if: ${{ !inputs.dry_run }}
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v$VERSION" -m "Release v$VERSION"
          git push origin "v$VERSION"
          echo "Pushed v$VERSION." >> "$GITHUB_STEP_SUMMARY"

      - name: Dispatch release for the tag
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          # GITHUB_TOKEN pushes do not trigger push workflows; dispatch does.
          gh workflow run release.yml --ref "v$VERSION"
          echo "Dispatched release.yml for v$VERSION; PyPI publication awaits environment approval." >> "$GITHUB_STEP_SUMMARY"
