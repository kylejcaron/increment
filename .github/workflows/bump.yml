name: bump

# Creates the release tag and explicitly dispatches release.yml on that tag.
#
# There is no version string to edit: hatch-vcs derives the version from the
# tag, so "bumping" is exactly "tagging". This is why the repo does not use
# release-please or bump-my-version -- both write a version into files and
# would fight hatch-vcs for ownership of the number.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, without the leading v (e.g. 0.1.0, 1.2.0rc1)"
        required: true
        type: string
      force:
        description: "Explicitly bypass the CI gate (not recommended)"
        required: false
        default: false
        type: boolean

concurrency:
  group: bump
  cancel-in-progress: false

permissions: {}

jobs:
  tag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      checks: read
      actions: write
      statuses: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Validate version is PEP 440 and not already tagged
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          # Reject a leading v up front; the tag gets one, the version does not.
          case "$VERSION" in
            v*) echo "::error::pass the version without the leading v (got $VERSION)"; exit 1 ;;
          esac

          python3 - <<'PY'
          import os, re, sys
          # PEP 440 public version identifiers only. Local versions (with '+')
          # are deliberately unmatched: PyPI rejects them.
          pattern = r'^([1-9][0-9]*!)?(0|[1-9][0-9]*)(\.(0|[1-9][0-9]*))*((a|b|rc)(0|[1-9][0-9]*))?(\.post(0|[1-9][0-9]*))?(\.dev(0|[1-9][0-9]*))?$'
          v = os.environ["VERSION"]
          if not re.match(pattern, v):
              sys.exit(f"::error::'{v}' is not a valid PEP 440 public version")
          print(f"{v} is a valid PEP 440 public version")
          PY

          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            echo "::error::tag v$VERSION already exists"
            exit 1
          fi

      - name: Require green checks on this commit
        if: ${{ !inputs.force }}
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/
        run: |
          set -euo pipefail

          # Include every page, but not this bump run: its tag job is running
          # while this gate executes. Other unfinished checks must block release.
          runs=$(gh api --paginate --slurp \
            "repos/${GITHUB_REPOSITORY}/commits/${SHA}/check-runs?per_page=100&filter=latest" \
            | jq --arg run_url "$RUN_URL" \
              '[.[].check_runs[] | select((.app.slug == "github-actions" and
                ((.details_url // "") | startswith($run_url))) | not)]')

          if ! printf '%s' "$runs" | jq -e --arg sha "$SHA" \
            'any(.[]; .name == "ci-ok" and .app.slug == "github-actions" and
              .head_sha == $sha and .status == "completed" and .conclusion == "success")' >/dev/null; then
            echo "::error::ci-ok must finish successfully on $SHA before release"
            exit 1
          fi

          bad=$(printf '%s' "$runs" | jq -r \
            '.[] | select(.status != "completed" or
              (.conclusion != "success" and .conclusion != "neutral" and .conclusion != "skipped")) | .name')
          if [ -n "$bad" ]; then
            echo "::error::these checks are unfinished or did not pass on $SHA:"
            printf '%s\n' "$bad"
            exit 1
          fi

          # Legacy statuses are independent of check runs; an absent status is
          # fine, but an existing pending or failed status is not.
          status_json=$(gh api --paginate --slurp \
            "repos/${GITHUB_REPOSITORY}/commits/${SHA}/status?per_page=100")
          status_total=$(printf '%s' "$status_json" | jq '[.[].statuses[]] | length')
          if [ "$status_total" -gt 0 ] && printf '%s' "$status_json" \
            | jq -e 'any(.[]; .state != "success")' >/dev/null; then
            echo "::error::legacy commit statuses are not all successful on $SHA"
            printf '%s' "$status_json" | jq -r \
              '.[].statuses[] | select(.state != "success") | .context'
            exit 1
          fi
          checks_total=$(printf '%s' "$runs" | jq 'length')
          echo "$checks_total check run(s), $status_total commit status(es), all green"

      - name: Create and push the tag
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v$VERSION" -m "Release v$VERSION"
          git push origin "v$VERSION"
          echo "Pushed v$VERSION." >> "$GITHUB_STEP_SUMMARY"

      - name: Dispatch release for the tag
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          # GITHUB_TOKEN pushes do not trigger push workflows; dispatch does.
          gh workflow run release.yml --ref "v$VERSION"
          echo "Dispatched release.yml for v$VERSION; PyPI publication awaits environment approval." >> "$GITHUB_STEP_SUMMARY"
