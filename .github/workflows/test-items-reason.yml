name: test item increase reason

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions: {}

jobs:
  item-increase-reason:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {fetch-depth: 0, persist-credentials: false}
      - name: Require a reason for each increased tier baseline
        env:
          BASE_REF: ${{ github.base_ref }}
          GITHUB_PR_BODY: ${{ github.event.pull_request.body }}
        run: python3 scripts/check_item_increase_approval.py --base "origin/$BASE_REF"
