name: test item increase reason

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions: {}

jobs:
  item-increase-reason:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {fetch-depth: 0, persist-credentials: false}
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          python-version: "3.12"
      - run: uv sync --group dev --extra demo --extra tables --extra dashboard
      - name: Require a reason for each tier whose collected items rise
        env:
          BASE_REF: ${{ github.base_ref }}
          GITHUB_PR_BODY: ${{ github.event.pull_request.body }}
        run: uv run --no-sync python -m scripts.check_item_increase_approval --base "origin/$BASE_REF"
