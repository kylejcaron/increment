name: weekly

on:
  schedule:
    - cron: "0 8 * * 0" # Sunday, 08:00 UTC
  workflow_dispatch:

permissions:
  contents: read

env:
  UV_LOCKED: "1"

jobs:
  # Slow and notebook examples are outside CI's fast suite. Exercise latest
  # dependencies and floors on each interpreter; Monte Carlo runs once below.
  test-all:
    name: full suite (slow + examples, ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with: {enable-cache: true, python-version: "${{ matrix.python-version }}"}
      - run: uv run --with nox nox -s "tests_full-${{ matrix.python-version }}"
      - name: Retain full-suite evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: full-suite-${{ matrix.python-version }}-${{ github.run_attempt }}
          path: .test-evidence/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

  test-all-floor:
    name: full suite at dependency floors (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with: {enable-cache: true, python-version: "${{ matrix.python-version }}"}
      - run: uv run --with nox nox -s "tests_floor_full-${{ matrix.python-version }}"
      - name: Retain floor-suite evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: floor-suite-${{ matrix.python-version }}-${{ github.run_attempt }}
          path: .test-evidence/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

  # One Python/latest-dependency run, split four ways. Without a local durations
  # file, pytest-split distributes by test count; do not assume balanced runtimes.
  test-parameter-recovery:
    name: Monte-Carlo tier, shard ${{ matrix.group }}/4
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        group: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with: {enable-cache: true, python-version: "3.12"}
      - run: uv run --with nox nox -s tests_parameter_recovery -- --splits 4 --group ${{ matrix.group }}
      - name: Retain Monte-Carlo evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: parameter-recovery-shard-${{ matrix.group }}-${{ github.run_attempt }}
          path: .test-evidence/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

  warehouse-backends:
    name: warehouse backends
    uses: ./.github/workflows/warehouse-backends.yml
    with: {backend_mode: all}
    secrets: inherit

  report-failure:
    name: report a failed weekly gate
    runs-on: ubuntu-latest
    needs: [test-all, test-all-floor, test-parameter-recovery, warehouse-backends]
    if: failure()
    timeout-minutes: 10
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Ensure the tracking label exists
        run: |
          gh label create weekly-failure \
            --repo "$REPOSITORY" \
            --color B60205 \
            --description "Opened automatically when a weekly validation gate fails" \
            --force
        env: {REPOSITORY: "${{ github.repository }}"}
      - name: File or update the tracking issue
        run: |
          set -euo pipefail
          existing=$(gh issue list \
            --repo "$REPOSITORY" \
            --label weekly-failure \
            --state open \
            --json number \
            --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" \
              --repo "$REPOSITORY" \
              --body "Weekly validation failed again: $RUN_URL"
          else
            gh issue create \
              --repo "$REPOSITORY" \
              --title "Weekly validation failed: $RUN_URL" \
              --label weekly-failure \
              --body "A weekly test suite or warehouse backend gate failed. See $RUN_URL for logs and retained evidence artifacts."
          fi
        env:
          REPOSITORY: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
