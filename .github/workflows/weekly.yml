name: weekly

on:
  schedule:
    - cron: "0 8 * * 0" # Sunday, 08:00 UTC
  workflow_dispatch:

permissions:
  contents: read

env:
  UV_LOCKED: "1"

jobs:
  test-all-floor:
    name: full suite at dependency floors (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with: {enable-cache: true, python-version: "${{ matrix.python-version }}"}
      - run: uv run --with nox nox -s "tests_floor_full-${{ matrix.python-version }}" -- --durations=25 --junitxml=junit.xml -n auto --dist loadgroup
      - name: Retain floor-suite JUnit report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: floor-suite-junit-${{ matrix.python-version }}-${{ github.run_attempt }}
          path: |
            junit.xml
            junit-numerical.xml
          if-no-files-found: warn
          retention-days: 30


  warehouse-backends:
    name: warehouse backends
    uses: ./.github/workflows/warehouse-backends.yml
    with: {backend_mode: all}
    secrets: inherit

  parity-matrix-10x:
    name: full parity matrix at tenfold data size
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      INCREMENT_PARITY_DATA_SCALE: "10"
      INCREMENT_PARITY_MATRIX: full
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with: {enable-cache: true, python-version: "3.12"}
      - run: uv sync --group dev --extra demo --extra tables --extra dashboard
      - run: uv run pytest tests/test_parity_matrix.py -m 'not benchmark'
  report-failure:
    name: report a failed weekly gate
    runs-on: ubuntu-latest
    needs: [test-all-floor, warehouse-backends, parity-matrix-10x]
    if: failure()
    timeout-minutes: 10
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Ensure the tracking label exists
        run: |
          gh label create weekly-failure \
            --repo "$REPOSITORY" \
            --color B60205 \
            --description "Opened automatically when a weekly validation gate fails" \
            --force
        env: {REPOSITORY: "${{ github.repository }}"}
      - name: File or update the tracking issue
        run: |
          set -euo pipefail
          existing=$(gh issue list \
            --repo "$REPOSITORY" \
            --label weekly-failure \
            --state open \
            --json number \
            --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" \
              --repo "$REPOSITORY" \
              --body "Weekly validation failed again: $RUN_URL"
          else
            gh issue create \
              --repo "$REPOSITORY" \
              --title "Weekly validation failed: $RUN_URL" \
              --label weekly-failure \
              --body "A weekly test suite or warehouse backend gate failed. See $RUN_URL for logs and retained evidence artifacts."
          fi
        env:
          REPOSITORY: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
