name: nightly

on:
  schedule:
    - cron: "0 6 * * *" # Daily, 06:00 UTC
  workflow_dispatch:
  pull_request:
    types: [labeled]

permissions:
  contents: read

env:
  UV_LOCKED: "1"
  INCREMENT_PARITY_MATRIX: full

jobs:
  benchmark:
    name: representative analysis benchmarks
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'benchmark'))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with: {enable-cache: true, python-version: "3.12"}
      - run: uv sync --group dev --extra demo --extra tables --extra dashboard
      - name: Check for CI benchmark baseline
        id: baseline
        run: |
          if test -f tests/fixtures/benchmarks/ci-baseline.json; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "no CI baseline" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Run benchmark suite
        run: |
          if [ "${{ steps.baseline.outputs.present }}" = true ]; then
            uv run pytest tests/benchmarks/test_analysis_benchmark.py -m benchmark -n 0 --benchmark-only --benchmark-compare=tests/fixtures/benchmarks/ci-baseline.json --benchmark-compare-fail=mean:25% --benchmark-save=nightly -W "ignore::pytest_benchmark.logger.PytestBenchmarkWarning"
          else
            uv run pytest tests/benchmarks/test_analysis_benchmark.py -m benchmark -n 0 --benchmark-only --benchmark-save=nightly
          fi
      - name: Run context measurements
        run: uv run pytest tests/test_kernel_context_measurement.py -m benchmark -n 0
      - name: Retain nightly benchmark data
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: benchmark-${{ github.run_id }}-${{ github.run_attempt }}
          path: .benchmarks/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
  test-all:
    if: github.event_name != 'pull_request'
    name: full suite (locked dependencies, slow + examples, ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with: {enable-cache: true, python-version: "${{ matrix.python-version }}"}
      - run: uv run --with nox nox -s "tests_full-${{ matrix.python-version }}" -- --durations=25 --junitxml=junit.xml -n auto --dist loadgroup
      - name: Retain full-suite JUnit report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: full-suite-junit-${{ matrix.python-version }}-${{ github.run_attempt }}
          path: |
            junit.xml
            junit-numerical.xml
          if-no-files-found: warn
          retention-days: 30
  record-durations:
    if: github.event_name != 'pull_request'
    name: record ${{ matrix.tier }}-test durations (part ${{ matrix.group }}/${{ matrix.splits }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # The slow tier records in parts so each finishes well inside the timeout on a hosted runner.
        include:
          - {tier: fast, group: 1, splits: 1}
          - {tier: slow, group: 1, splits: 4}
          - {tier: slow, group: 2, splits: 4}
          - {tier: slow, group: 3, splits: 4}
          - {tier: slow, group: 4, splits: 4}
    env:
      TIER: ${{ matrix.tier }}
      GROUP: ${{ matrix.group }}
      SPLITS: ${{ matrix.splits }}
      WORKERS: "4"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with: {enable-cache: true, python-version: "3.12"}
      - run: uv sync --group dev --extra demo --extra tables --extra dashboard
      # The committed weights split the parts; --clean-durations keeps only the tests this part ran.
      - name: Record ${{ matrix.tier }}-test durations
        run: make "test-$TIER" WORKERS="$WORKERS" PYTEST_ARGS="--store-durations --clean-durations --durations-path .github/$TIER-test-durations.json --splits $SPLITS --group $GROUP --splitting-algorithm least_duration"
      - name: Describe the recorded part
        run: |
          mkdir durations-part
          cp ".github/$TIER-test-durations.json" durations-part/
          uv run --no-sync python - <<'PY'
          import json
          import os
          import platform
          from pathlib import Path

          metadata = {
              "tier": os.environ["TIER"],
              "group": int(os.environ["GROUP"]),
              "splits": int(os.environ["SPLITS"]),
              "workers": int(os.environ["WORKERS"]),
              "python": platform.python_version(),
              "source_sha": os.environ["GITHUB_SHA"],
              "ref": os.environ["GITHUB_REF"],
              "run_id": os.environ["GITHUB_RUN_ID"],
              "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
          }
          Path("durations-part/metadata.json").write_text(json.dumps(metadata, indent=2) + "\n")
          PY
      - name: Upload the recorded part
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.tier }}-test-durations-part-${{ matrix.group }}
          path: durations-part/
          if-no-files-found: error
          retention-days: 7
      - name: Measure fast-test selection
        if: matrix.tier == 'fast'
        run: uv run --no-sync python scripts/selection_probe.py --summary --no-timing
        continue-on-error: true
  publish-durations:
    if: ${{ github.event_name != 'pull_request' && needs.record-durations.result == 'success' }}
    name: publish test-duration weights
    needs: record-durations
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: "*-test-durations-part-*"
          path: parts
      - name: Merge every part of each tier
        run: |
          python3 - <<'PY'
          import json
          from collections import defaultdict
          from pathlib import Path

          parts = defaultdict(list)
          for path in sorted(Path("parts").glob("*/metadata.json")):
              metadata = json.loads(path.read_text())
              durations = json.loads((path.parent / f"{metadata['tier']}-test-durations.json").read_text())
              parts[metadata["tier"]].append((metadata, durations))
          for tier, recorded in sorted(parts.items()):
              splits = {metadata["splits"] for metadata, _ in recorded}
              groups = sorted(metadata["group"] for metadata, _ in recorded)
              if len(splits) != 1 or groups != list(range(1, max(splits) + 1)):
                  raise SystemExit(f"{tier}: recorded parts {groups} do not cover splits {sorted(splits)}")
              durations = {}
              for _, part in recorded:
                  durations.update(part)
              # Sharded runs weigh an xdist_group test as <node ID>@<group>; selection prediction looks up the bare ID.
              for nodeid, seconds in list(durations.items()):
                  bare, _, group = nodeid.rpartition("@")
                  if bare and "]" not in group and "::" not in group:
                      durations[bare] = seconds
              output = Path("weights") / tier
              output.mkdir(parents=True)
              rounded = {nodeid: round(seconds, 3) for nodeid, seconds in durations.items()}
              (output / f"{tier}-test-durations.json").write_text(json.dumps(rounded, indent=4, sort_keys=True) + "\n")
              metadata = {key: value for key, value in recorded[0][0].items() if key != "group"}
              (output / "metadata.json").write_text(json.dumps(metadata, indent=2) + "\n")
          PY
      - name: Upload fast-test durations
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fast-test-durations
          path: weights/fast/
          if-no-files-found: error
          retention-days: 30
      - name: Upload slow-test durations
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: slow-test-durations
          path: weights/slow/
          if-no-files-found: error
          retention-days: 30
  refresh-selection-map:
    if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && needs.record-durations.result == 'success' }}
    name: refresh fast selection map
    needs: record-durations
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {fetch-depth: 0}
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with: {enable-cache: true, python-version: "3.12"}
      - run: uv sync --group dev --extra demo --extra tables --extra dashboard
      - name: Build selection map
        run: make selection-map
      - name: Open or update selection-map PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- tests/selection_map.json; then
            echo "Selection map is unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --prune origin +refs/heads/bot/selection-map:refs/remotes/origin/bot/selection-map || true
          remote_tip="$(git rev-parse --verify refs/remotes/origin/bot/selection-map 2>/dev/null || true)"
          git checkout -B bot/selection-map
          git add tests/selection_map.json
          git commit -m "Refresh fast selection map"
          if [ -n "$remote_tip" ]; then
            git push --force-with-lease=refs/heads/bot/selection-map:"$remote_tip" origin HEAD:refs/heads/bot/selection-map
          else
            git push --force-with-lease=refs/heads/bot/selection-map: origin HEAD:refs/heads/bot/selection-map
          fi
          gh label create selection-map --color 1d76db --description "Generated test selection map" 2>/dev/null || true
          if gh pr view bot/selection-map >/dev/null 2>&1; then
            gh pr edit bot/selection-map --title "Refresh fast selection map" --body "Regenerate \`tests/selection_map.json\` from the nightly fast-tier coverage run." --add-label selection-map
          else
            gh pr create --base main --head bot/selection-map --title "Refresh fast selection map" --body "Regenerate \`tests/selection_map.json\` from the nightly fast-tier coverage run." --label selection-map
          fi

  test-scientific:
    if: github.event_name != 'pull_request'
    name: scientific tiers, shard ${{ matrix.group }}/4
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        group: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with: {enable-cache: true, python-version: "3.12"}
      - run: uv run --with nox nox -s tests_scientific -- --splits 4 --group ${{ matrix.group }} --durations=25 --junitxml=junit.xml -n auto --dist loadgroup
      - name: Retain scientific JUnit report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scientific-junit-shard-${{ matrix.group }}-${{ github.run_attempt }}
          path: junit.xml
          if-no-files-found: warn
          retention-days: 30

  randomized-fast:
    if: github.event_name != 'pull_request'
    name: randomized-order fast tier
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with: {enable-cache: true, python-version: "3.12"}
      - run: uv sync --group dev --extra demo --extra tables --extra dashboard
      - name: Log randomized-order seed
        run: echo "pytest-randomly seed=20261017"
      # pytest-randomly is installed only for this job, so every other run keeps declaration order.
      - run: make test-fast WORKERS=auto PYTEST="uv run --with pytest-randomly --extra demo --extra tables --extra dashboard pytest" PYTEST_ARGS="-p randomly --randomly-seed=20261017 --durations=25 --junitxml=random-fast-junit.xml"
      - name: Retain randomized fast JUnit report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nightly-random-fast-junit-${{ github.run_attempt }}
          path: random-fast-junit.xml
          if-no-files-found: warn
          retention-days: 30
  warehouse-postgres:
    if: github.event_name != 'pull_request'
    name: warehouse PostgreSQL suite
    permissions:
      contents: read
    uses: ./.github/workflows/warehouse-backends.yml
    with:
      backend_mode: postgres
      postgres_shards: 1

  mutation-evidence:
    if: github.event_name != 'pull_request'
    name: mutation evidence (${{ matrix.campaign }})
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      CI: "true"
    strategy:
      fail-fast: false
      matrix:
        campaign: [tails, variance, armstats, quantile, power, meta]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with: {enable-cache: true, python-version: "3.12"}
      - run: uv sync --group dev --extra demo --extra tables --extra dashboard
      - run: make mutate CAMPAIGN=${{ matrix.campaign }} KILL_MATRIX=1
      - name: Retain mutation evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutation-evidence-${{ matrix.campaign }}
          path: |
            mutation-results/${{ matrix.campaign }}.json
            mutation-results/${{ matrix.campaign }}.log
          if-no-files-found: warn
          retention-days: 30

  report-failure:
    name: report a failed nightly gate
    runs-on: ubuntu-latest
    needs: [test-all, record-durations, publish-durations, test-scientific, randomized-fast, mutation-evidence, warehouse-postgres, benchmark]
    if: github.event_name != 'pull_request' && failure()
    timeout-minutes: 10
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Ensure the tracking label exists
        run: |
          gh label create nightly-failure \
            --repo "$REPOSITORY" \
            --color B60205 \
            --description "Opened automatically when a nightly validation gate fails" \
            --force
        env: {REPOSITORY: "${{ github.repository }}"}
      - name: File or update the tracking issue
        run: |
          set -euo pipefail
          existing=$(gh issue list \
            --repo "$REPOSITORY" \
            --label nightly-failure \
            --state open \
            --json number \
            --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" \
              --repo "$REPOSITORY" \
              --body "Nightly validation failed again: $RUN_URL"
          else
            gh issue create \
              --repo "$REPOSITORY" \
              --title "Nightly validation failed: $RUN_URL" \
              --label nightly-failure \
              --body "A nightly test suite failed. See $RUN_URL for logs and retained evidence artifacts."
          fi
        env:
          REPOSITORY: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
