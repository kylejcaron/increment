name: ci

on:
  workflow_dispatch:
    inputs:
      coverage:
        description: "Collect coverage for the Python 3.12 fast-test shards"
        type: boolean
        default: true
        required: true
  push: {branches: [main]}
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with: {enable-cache: true}
      - run: uv sync --group dev --extra demo --extra tables --extra dashboard
      - run: uv run python scripts/check_doc_references.py --check --collect
      - run: uv run python scripts/render_capability_table.py --check
      - run: uv run python scripts/render_error_codes.py --check
      - run: make lint
      - run: uv run --no-sync python scripts/import_reach.py --summary
      - run: uv run ty check

  test:
    name: fast (${{ matrix.python-version }}, shard ${{ matrix.group }}/${{ matrix.splits }})
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      # Three duration-weighted shards per Python version keep each job well under this
      # timeout on slower runners. ci-ok's coverage combine passes the same `--splits`.
      matrix:
        include: ${{ fromJSON(github.event_name == 'pull_request' && '[{"python-version":"3.12","group":1,"splits":3},{"python-version":"3.12","group":2,"splits":3},{"python-version":"3.12","group":3,"splits":3}]' || '[{"python-version":"3.12","group":1,"splits":3},{"python-version":"3.12","group":2,"splits":3},{"python-version":"3.12","group":3,"splits":3},{"python-version":"3.13","group":1,"splits":3},{"python-version":"3.13","group":2,"splits":3},{"python-version":"3.13","group":3,"splits":3},{"python-version":"3.14","group":1,"splits":3},{"python-version":"3.14","group":2,"splits":3},{"python-version":"3.14","group":3,"splits":3}]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {fetch-depth: 0, persist-credentials: false}
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - run: uv sync --group dev --extra demo --extra tables --extra dashboard
      - name: Cache rewritten test bytecode
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .pytest_cache/rewritten-bytecode
          key: rewritten-bytecode-${{ runner.os }}-${{ matrix.python-version }}-${{ hashFiles('uv.lock', 'conftest.py', 'tests/**/*.py') }}
          restore-keys: rewritten-bytecode-${{ runner.os }}-${{ matrix.python-version }}-
      - name: Reuse rewritten bytecode of unchanged tests
        continue-on-error: true
        run: uv run --no-sync python scripts/rewritten_bytecode_cache.py restore .pytest_cache/rewritten-bytecode
      - id: fast-tests
        env:
          INCREMENT_COLLECT_OUTPUT: junit-collection.json
          INCREMENT_COLLECT_TIERS: '{"unit":"not slow and not integration and not parameter_recovery and not numerical_certification and not examples and not stress and not benchmark and not tooling","integration":"integration and not slow and not parameter_recovery and not numerical_certification and not examples and not stress and not benchmark and not tooling"}'
          INCREMENT_COLLECT_SHARD_ID: ${{ matrix.python-version }}-${{ matrix.group }}
        run: |
          coverage_enabled="${{ github.event_name == 'push' || (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'test-reduction-approved')) || (github.event_name == 'workflow_dispatch' && inputs.coverage) }}"
          coverage_args=""
          if [ "${{ matrix.python-version }}" = "3.12" ] && [ "$coverage_enabled" = "true" ]; then
            export COVERAGE_CORE=sysmon
            coverage_args="--cov=increment --cov-report=json:coverage.json"
          fi
          make test-fast WORKERS=auto PYTEST_ARGS="-p scripts.collect_items_plugin --durations=25 --junitxml=junit.xml --cpu-report cpu.json --splits ${{ matrix.splits }} --group ${{ matrix.group }} --splitting-algorithm least_duration --durations-path .github/fast-test-durations.json $coverage_args"
      - name: Stage rewritten test bytecode for the cache
        continue-on-error: true
        run: uv run --no-sync python scripts/rewritten_bytecode_cache.py save .pytest_cache/rewritten-bytecode
      - name: Record fast coverage shard metadata
        if: always() && matrix.python-version == '3.12'
        env:
          SHA: ${{ github.sha }}
          ATTEMPT: ${{ github.run_attempt }}
          SHARD: ${{ matrix.group }}
          TEST_OUTCOME: ${{ steps.fast-tests.outcome }}
        run: |
          mkdir -p .fast-coverage
          python -c 'import json, os; from pathlib import Path; Path(".fast-coverage/metadata.json").write_text(json.dumps({"sha": os.environ["SHA"], "attempt": int(os.environ["ATTEMPT"]), "python": "3.12", "shard": int(os.environ["SHARD"]), "outcome": os.environ["TEST_OUTCOME"]}) + "\n")'
          if [ -f coverage.json ]; then cp coverage.json .fast-coverage/coverage.json; fi
      - name: Retain fast coverage shard
        if: always() && matrix.python-version == '3.12'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        continue-on-error: true
        with:
          name: fast-coverage-3.12-shard-${{ matrix.group }}-${{ github.sha }}-${{ github.run_attempt }}
          path: .fast-coverage/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30
      - name: Record fast JUnit shard metadata
        if: always()
        env:
          SHARD_ID: ${{ matrix.python-version }}-${{ matrix.group }}
          TEST_OUTCOME: ${{ steps.fast-tests.outcome }}
        run: |
          python -c 'import json, os; from pathlib import Path; Path("junit-metadata.json").write_text(json.dumps({"shard_id": os.environ["SHARD_ID"], "junit_present": Path("junit.xml").is_file(), "outcome": os.environ["TEST_OUTCOME"]}) + "\n")'
      - name: Report fast items over budget
        if: always()
        continue-on-error: true
        run: |
          if [ -f junit.xml ]; then
            python scripts/duration_report.py junit.xml --collection junit-collection.json >> "$GITHUB_STEP_SUMMARY"
            python scripts/duration_report.py junit.xml >> "$GITHUB_STEP_SUMMARY"
          else
            printf 'Fast duration report unavailable: no JUnit file.\n' >> "$GITHUB_STEP_SUMMARY"
          fi
          exit 0
      - name: Retain fast JUnit report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fast-junit-${{ matrix.python-version }}-shard-${{ matrix.group }}-${{ github.run_attempt }}
          path: |
            junit.xml
            junit-metadata.json
            junit-collection.json
          if-no-files-found: warn
          retention-days: 30
      - name: Retain CPU usage
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        continue-on-error: true
        with:
          # The trailing job ID ties the record to one job execution (scripts/ci_cost_report.py).
          name: cpu-fast-${{ matrix.python-version }}-shard-${{ matrix.group }}-${{ job.check_run_id }}
          path: cpu.json
          if-no-files-found: warn
          retention-days: 90

  unit-newest:
    name: unit (3.14)
    if: github.event_name == 'pull_request'
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          python-version: "3.14"
      - run: uv sync --group dev --extra demo --extra tables --extra dashboard
      - name: Cache rewritten test bytecode
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .pytest_cache/rewritten-bytecode
          key: rewritten-bytecode-${{ runner.os }}-3.14-${{ hashFiles('uv.lock', 'conftest.py', 'tests/**/*.py') }}
          restore-keys: rewritten-bytecode-${{ runner.os }}-3.14-
      - name: Reuse rewritten bytecode of unchanged tests
        continue-on-error: true
        run: uv run --no-sync python scripts/rewritten_bytecode_cache.py restore .pytest_cache/rewritten-bytecode
      - run: make test-unit WORKERS=auto PYTEST_ARGS="--cpu-report cpu.json"
      - name: Stage rewritten test bytecode for the cache
        continue-on-error: true
        run: uv run --no-sync python scripts/rewritten_bytecode_cache.py save .pytest_cache/rewritten-bytecode
      - name: Retain newest-Python unit CPU usage
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        continue-on-error: true
        with:
          name: cpu-unit-3.14-${{ job.check_run_id }}
          path: cpu.json
          if-no-files-found: warn
          retention-days: 90

  selection-misses:
    if: always()
    runs-on: ubuntu-latest
    continue-on-error: true
    needs: test
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {fetch-depth: 0, persist-credentials: false}
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with: {enable-cache: true, python-version: "3.12"}
      - run: uv sync --group dev --extra demo --extra tables --extra dashboard
      - name: Predict selected files
        if: always()
        continue-on-error: true
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          AFFECTED_SHARD_ID: all
        run: |
          if [ -z "$BASE" ]; then
            echo "incomplete evidence: no base" > affected-report.json
            echo "incomplete evidence: no base" >> "$GITHUB_STEP_SUMMARY"
          else
            uv run --no-sync python -m pytest -m "not slow and not parameter_recovery and not numerical_certification and not examples and not stress and not benchmark and not tooling" --co -q --tach-base "$BASE" --affected-tier fast --affected-report affected-report.json tests
          fi
      - name: Retain selection prediction
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        continue-on-error: true
        with:
          name: affected-report-all-${{ github.run_attempt }}
          path: affected-report.json
          if-no-files-found: warn
          retention-days: 90
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: fast-junit-*
          path: selection-input/junit
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: affected-report-*
          path: selection-input/affected
      - name: Merge predictions and report misses
        if: always()
        continue-on-error: true
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.sha }}
          EXPECTED_SHARDS: ${{ github.event_name == 'pull_request' && '3.12-1,3.12-2,3.12-3' || '3.12-1,3.12-2,3.12-3,3.13-1,3.13-2,3.13-3,3.14-1,3.14-2,3.14-3' }}
        run: |
          if [ -z "$BASE" ]; then
            printf 'incomplete evidence: no base\n' > selection-misses.txt
            cat selection-misses.txt >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          shopt -s globstar nullglob
          reports=(selection-input/affected/**/*.json)
          junit=(selection-input/junit/**/*.xml)
          junit_metadata=(selection-input/junit/**/junit-metadata.json)
          uv run --no-sync python scripts/selection_map.py merge --reports "${reports[@]}" --output affected-report.json
          uv run --no-sync python scripts/selection_map.py misses --base "$BASE" --head "$HEAD" --junit "${junit[@]}" --junit-metadata "${junit_metadata[@]}" --expected-shards "$EXPECTED_SHARDS" --report affected-report.json
          cat selection-misses.txt >> "$GITHUB_STEP_SUMMARY"
      - name: Retain selection miss report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: selection-misses-${{ github.run_attempt }}
          path: selection-misses.txt
          if-no-files-found: warn
          retention-days: 90
  slow:
    name: functional slow (3.12, shard ${{ matrix.group }}/8)
    needs: [changes]
    # A pull request runs this tier only once it carries the ready-to-merge label, and
    # only when the change can reach it; ci-ok fails a required tier that did not run.
    # It does not wait for lint, which ci-ok still requires.
    if: ${{ needs.changes.outputs.slow_required == 'true' && (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ready-to-merge')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        group: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {fetch-depth: 0, persist-credentials: false}
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          python-version: "3.12"
      - run: uv sync --group dev --extra demo --extra tables --extra dashboard
      - name: Cache rewritten test bytecode
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .pytest_cache/rewritten-bytecode
          key: rewritten-bytecode-${{ runner.os }}-3.12-${{ hashFiles('uv.lock', 'conftest.py', 'tests/**/*.py') }}
          restore-keys: rewritten-bytecode-${{ runner.os }}-3.12-
      - name: Reuse rewritten bytecode of unchanged tests
        continue-on-error: true
        run: uv run --no-sync python scripts/rewritten_bytecode_cache.py restore .pytest_cache/rewritten-bytecode
      - name: Run slow tests
        id: slow-tests
        env:
          INCREMENT_COLLECT_OUTPUT: junit-collection.json
          INCREMENT_COLLECT_TIERS: '{"slow":"slow and not exhaustive and not parameter_recovery and not numerical_certification and not examples and not compile_registry and not benchmark and not tooling"}'
          INCREMENT_COLLECT_SHARD_ID: slow-${{ matrix.group }}
        run: make test-slow WORKERS=auto PYTEST_ARGS="-p scripts.collect_items_plugin --durations=25 --junitxml=junit.xml --cpu-report cpu.json --splits 8 --group ${{ matrix.group }} --splitting-algorithm least_duration --durations-path .github/slow-test-durations.json"
      - name: Stage rewritten test bytecode for the cache
        continue-on-error: true
        run: uv run --no-sync python scripts/rewritten_bytecode_cache.py save .pytest_cache/rewritten-bytecode
      - name: Record slow JUnit shard metadata
        if: always()
        env:
          SHARD_ID: slow-${{ matrix.group }}
          TEST_OUTCOME: ${{ steps.slow-tests.outcome }}
        run: |
          python -c 'import json, os; from pathlib import Path; Path("junit-metadata.json").write_text(json.dumps({"shard_id": os.environ["SHARD_ID"], "junit_present": Path("junit.xml").is_file(), "outcome": os.environ["TEST_OUTCOME"]}) + "\n")'
      - name: Report slow item durations
        if: always()
        continue-on-error: true
        run: |
          if [ -f junit.xml ] && [ -f junit-collection.json ]; then
            python scripts/duration_report.py junit.xml --collection junit-collection.json >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Retain slow JUnit report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: slow-junit-shard-${{ matrix.group }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            junit.xml
            junit-collection.json
            junit-metadata.json
          if-no-files-found: warn
          retention-days: 30
      - name: Retain CPU usage
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        continue-on-error: true
        with:
          name: cpu-slow-shard-${{ matrix.group }}-${{ job.check_run_id }}
          path: cpu.json
          if-no-files-found: warn
          retention-days: 90
  exhaustive:
    name: exhaustive cross-source (3.12, shard ${{ matrix.group }}/4)
    needs: [changes]
    if: ${{ needs.changes.outputs.exhaustive_required == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        group: [1, 2, 3, 4]
    # Item metadata pairs each shard's JUnit with the duration ratchet; exhaustive items have no
    # layer budget of their own and count against the slow budget.
    env:
      PYTEST_ADDOPTS: -p scripts.collect_items_plugin
      INCREMENT_COLLECT_OUTPUT: junit-collection.json
      INCREMENT_COLLECT_TIERS: '{"slow":"exhaustive and not parameter_recovery and not numerical_certification and not examples and not compile_registry and not benchmark and not tooling"}'
      INCREMENT_COLLECT_SHARD_ID: exhaustive-${{ matrix.group }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {fetch-depth: 0, persist-credentials: false}
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          python-version: "3.12"
      - run: uv sync --group dev --extra demo --extra tables --extra dashboard
      - name: Cache rewritten test bytecode
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .pytest_cache/rewritten-bytecode
          key: rewritten-bytecode-${{ runner.os }}-3.12-${{ hashFiles('uv.lock', 'conftest.py', 'tests/**/*.py') }}
          restore-keys: rewritten-bytecode-${{ runner.os }}-3.12-
      - name: Reuse rewritten bytecode of unchanged tests
        continue-on-error: true
        run: uv run --no-sync python scripts/rewritten_bytecode_cache.py restore .pytest_cache/rewritten-bytecode
      - run: make test-exhaustive WORKERS=auto PYTEST_ARGS="--durations=25 --junitxml=junit.xml --cpu-report cpu.json --splits 4 --group ${{ matrix.group }} --splitting-algorithm least_duration --durations-path .github/exhaustive-test-durations.json"
      - name: Stage rewritten test bytecode for the cache
        continue-on-error: true
        run: uv run --no-sync python scripts/rewritten_bytecode_cache.py save .pytest_cache/rewritten-bytecode
      - name: Retain exhaustive JUnit report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: exhaustive-junit-shard-${{ matrix.group }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            junit.xml
            junit-collection.json
          if-no-files-found: warn
          retention-days: 30
      - name: Retain CPU usage
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        continue-on-error: true
        with:
          name: cpu-exhaustive-shard-${{ matrix.group }}-${{ job.check_run_id }}
          path: cpu.json
          if-no-files-found: warn
          retention-days: 90
  duration-ratchet:
    if: always()
    needs: [test, slow, exhaustive]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      # Duration evidence is the fast, functional-slow and exhaustive shards' reports only.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          pattern: "fast-junit-*"
          path: duration-artifacts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          pattern: "slow-junit-*"
          path: duration-artifacts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          pattern: "exhaustive-junit-*"
          path: duration-artifacts
      - name: Report aggregate per-layer duration ratchet
        shell: bash
        env:
          EXPECTED_DURATION_SHARDS: ${{ github.event_name == 'pull_request' && '3.12-1,3.12-2,3.12-3,slow-1,slow-2,slow-3,slow-4,slow-5,slow-6,slow-7,slow-8' || '3.12-1,3.12-2,3.12-3,3.13-1,3.13-2,3.13-3,3.14-1,3.14-2,3.14-3,slow-1,slow-2,slow-3,slow-4,slow-5,slow-6,slow-7,slow-8' }}
          # The exhaustive gate's shards are evidence only when the gate ran.
          EXHAUSTIVE_DURATION_SHARDS: ${{ needs.exhaustive.result != 'skipped' && ',exhaustive-1,exhaustive-2,exhaustive-3,exhaustive-4' || '' }}
        run: python scripts/duration_report.py --artifacts-dir duration-artifacts --baseline tests/layer_time_baseline.json --expected-shards "$EXPECTED_DURATION_SHARDS$EXHAUSTIVE_DURATION_SHARDS" | tee -a "$GITHUB_STEP_SUMMARY"

  tooling:
    name: repository tooling
    needs: [lint, changes]
    if: ${{ needs.changes.outputs.tooling_required == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with: {enable-cache: true, python-version: "3.12"}
      - run: uv sync --group dev --extra demo --extra tables --extra dashboard
      - name: Cache rewritten test bytecode
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .pytest_cache/rewritten-bytecode
          key: rewritten-bytecode-${{ runner.os }}-3.12-${{ hashFiles('uv.lock', 'conftest.py', 'tests/**/*.py') }}
          restore-keys: rewritten-bytecode-${{ runner.os }}-3.12-
      - name: Reuse rewritten bytecode of unchanged tests
        continue-on-error: true
        run: uv run --no-sync python scripts/rewritten_bytecode_cache.py restore .pytest_cache/rewritten-bytecode
      - run: make test-tier TIER=tooling WORKERS=auto PYTEST_ARGS="--durations=25 --cpu-report cpu.json"
      - name: Stage rewritten test bytecode for the cache
        continue-on-error: true
        run: uv run --no-sync python scripts/rewritten_bytecode_cache.py save .pytest_cache/rewritten-bytecode
      - name: Retain tooling CPU usage
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        continue-on-error: true
        with:
          name: cpu-tooling-${{ job.check_run_id }}
          path: cpu.json
          if-no-files-found: warn
          retention-days: 90
  compile-registry:
    needs: [changes]
    if: ${{ needs.changes.outputs.compile_registry_required == 'true' }}
    name: warehouse compile registry (${{ matrix.dialect }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # Each dialect builds its own captured registry, so a cold cache costs
        # one build per runner instead of two side by side.
        dialect: [snowflake, bigquery]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {fetch-depth: 0, persist-credentials: false}
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          python-version: "3.12"
      - run: uv sync --group dev --extra demo --extra tables --extra dashboard
      - id: key
        run: |
          value=$(uv run --no-sync python -c 'from integration.warehouse_execution._compile import _captured_compile_cache_key; print(_captured_compile_cache_key("snowflake").removeprefix("snowflake-"))')
          echo "value=$value" >> "$GITHUB_OUTPUT"
      - name: Restore or save compiled warehouse registry
        id: registry-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .pytest_cache/warehouse_compile_registry
          key: compile-registry-${{ matrix.dialect }}-${{ steps.key.outputs.value }}
      - name: Cache rewritten test bytecode
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .pytest_cache/rewritten-bytecode
          key: rewritten-bytecode-${{ runner.os }}-3.12-${{ hashFiles('uv.lock', 'conftest.py', 'tests/**/*.py') }}
          restore-keys: rewritten-bytecode-${{ runner.os }}-3.12-
      - name: Reuse rewritten bytecode of unchanged tests
        continue-on-error: true
        run: uv run --no-sync python scripts/rewritten_bytecode_cache.py restore .pytest_cache/rewritten-bytecode
      - name: Compile registered statements
        env:
          DIALECT: ${{ matrix.dialect }}
          CACHE_HIT: ${{ steps.registry-cache.outputs.cache-hit }}
        run: |
          # Tests without a dialect parameter run on the snowflake runner.
          if [ "$DIALECT" = snowflake ]; then selection="not bigquery"; else selection="bigquery"; fi
          args=(-k "$selection")
          # The key covers every recorded module, and a cache entry is saved only
          # by a passing job, so an exact hit means this trace already passed.
          if [ "$CACHE_HIT" = true ]; then
            args+=(--deselect tests/test_warehouse_compile_registry.py::test_recorded_compile_dependencies_are_current)
          fi
          make test-tier TIER=compile-registry WORKERS=auto PYTEST_ARGS="--durations=25 ${args[*]@Q}"
      - name: Stage rewritten test bytecode for the cache
        continue-on-error: true
        run: uv run --no-sync python scripts/rewritten_bytecode_cache.py save .pytest_cache/rewritten-bytecode

  # Catches packaging breakage on every push/PR rather than at release time,
  # using the same gates release.yml applies before publishing.
  # Also builds the documentation when changed paths require it, saving a job.
  build:
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      snippets_result: ${{ steps.snippets.outcome }}
      strict_docs_result: ${{ steps.strict-docs.outcome }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: the version is derived from git tags.
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with: {enable-cache: true}
      - run: uv build --sdist --wheel --out-dir dist
      - run: uvx twine check --strict dist/*
      - run: uv run --with nox nox -s wheel_smoke wheel_smoke_demo
      - name: Reject artifacts with no package in them
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import glob, sys, zipfile
          whl = glob.glob("dist/*.whl")
          if not whl:
              sys.exit("::error::build produced no wheel")
          mods = [n for n in zipfile.ZipFile(whl[0]).namelist()
                  if n.startswith("increment/") and n.endswith(".py")]
          if not mods:
              sys.exit(f"::error::{whl[0]} contains no increment/*.py modules")
          print(f"{len(mods)} module(s)")
          PY
      - id: snippets
        if: ${{ needs.changes.outputs.snippets == 'true' }}
        run: uv run --with nox nox -s docs_snippets
      - id: strict-docs
        if: ${{ always() && needs.changes.outputs.strict_docs == 'true' }}
        run: uv run --with nox nox -s docs

  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      postgres_required: ${{ steps.postgres.outputs.required }}
      certification_required: ${{ steps.certification.outputs.required }}
      exhaustive_required: ${{ steps.exhaustive.outputs.required }}
      compile_registry_required: ${{ steps.compile_registry.outputs.required }}
      tooling_required: ${{ steps.tooling.outputs.required }}
      wheel_smoke_required: ${{ steps.packaging.outputs.required }}
      snippets: ${{ steps.docs.outputs.snippets }}
      strict_docs: ${{ steps.docs.outputs.strict_docs }}
      slow_required: ${{ steps.slow.outputs.required }}
      slow_reason: ${{ steps.slow.outputs.reason }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {fetch-depth: 0, persist-credentials: false}
      - id: postgres
        run: python scripts/postgres_ci_changes.py --event "$EVENT" --base "$BASE" --head "$HEAD" >> "$GITHUB_OUTPUT"
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
      - id: certification
        run: python scripts/certification_ci_changes.py --event "$EVENT" --base "$BASE" --head "$HEAD" >> "$GITHUB_OUTPUT"
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
      - id: exhaustive
        run: python scripts/certification_ci_changes.py --gate exhaustive --event "$EVENT" --base "$BASE" --head "$HEAD" >> "$GITHUB_OUTPUT"
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
      - id: compile_registry
        run: python scripts/compile_registry_ci_changes.py --event "$EVENT" --base "$BASE" --head "$HEAD" >> "$GITHUB_OUTPUT"
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
      - id: tooling
        run: python scripts/tooling_ci_changes.py --event "$EVENT" --base "$BASE" --head "$HEAD" >> "$GITHUB_OUTPUT"
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
      - id: packaging
        run: python scripts/packaging_ci_changes.py --event "$EVENT" --base "$BASE" --head "$HEAD" >> "$GITHUB_OUTPUT"
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
      - id: docs
        run: python scripts/docs_ci_changes.py --event "$EVENT" --base "$BASE" --head "$HEAD" --labels "$LABELS" >> "$GITHUB_OUTPUT"
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
      - id: slow
        run: python -m scripts.slow_required --event "$EVENT" --base "$BASE" --head "$HEAD" >> "$GITHUB_OUTPUT"
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}

  numerical-certification:
    name: numerical certification (shard ${{ matrix.group }}/2)
    needs: [lint, changes]
    if: ${{ needs.changes.outputs.certification_required == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        group: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {fetch-depth: 0, persist-credentials: false}
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with: {enable-cache: true, python-version: "3.12"}
      - run: uv sync --group dev --extra demo --extra tables --extra dashboard
      - name: Cache rewritten test bytecode
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .pytest_cache/rewritten-bytecode
          key: rewritten-bytecode-${{ runner.os }}-3.12-${{ hashFiles('uv.lock', 'conftest.py', 'tests/**/*.py') }}
          restore-keys: rewritten-bytecode-${{ runner.os }}-3.12-
      - name: Reuse rewritten bytecode of unchanged tests
        continue-on-error: true
        run: uv run --no-sync python scripts/rewritten_bytecode_cache.py restore .pytest_cache/rewritten-bytecode
      - run: make test-numerical-certification WORKERS=auto PYTEST_ARGS="--durations=25 --junitxml=junit.xml --cpu-report cpu.json --splits 2 --group ${{ matrix.group }} --splitting-algorithm least_duration --durations-path .github/certification-test-durations.json"
      - name: Stage rewritten test bytecode for the cache
        continue-on-error: true
        run: uv run --no-sync python scripts/rewritten_bytecode_cache.py save .pytest_cache/rewritten-bytecode
      - name: Retain certification JUnit report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: numerical-certification-junit-shard-${{ matrix.group }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: junit.xml
          if-no-files-found: warn
          retention-days: 30
      - name: Retain CPU usage
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        continue-on-error: true
        with:
          name: cpu-numerical-certification-shard-${{ matrix.group }}-${{ job.check_run_id }}
          path: cpu.json
          if-no-files-found: warn
          retention-days: 90

  warehouse-postgres:
    needs: changes
    if: ${{ needs.changes.outputs.postgres_required == 'true' }}
    permissions:
      contents: read
    uses: ./.github/workflows/warehouse-backends.yml
    with:
      backend_mode: postgres
      postgres_shards: 3

  wheel-smoke-macos:
    needs: changes
    if: ${{ needs.changes.outputs.wheel_smoke_required == 'true' }}
    runs-on: macos-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          python-version: "3.12"
      - run: uv build --wheel --out-dir dist
      - run: uv run --with nox nox -s wheel_smoke wheel_smoke_demo

  wheel-smoke-windows:
    needs: changes
    if: ${{ needs.changes.outputs.wheel_smoke_required == 'true' }}
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          python-version: "3.12"
      - run: uv build --wheel --out-dir dist
      - run: uv run --with nox nox -s wheel_smoke wheel_smoke_demo

  test-weakening:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {fetch-depth: 0, persist-credentials: false}
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with: {enable-cache: true}
      - run: uv sync --group dev --extra demo --extra tables --extra dashboard
      - name: Check for weakened tests
        env:
          APPROVED: ${{ contains(github.event.pull_request.labels.*.name, 'test-reduction-approved') }}
        run: |
          args=(--ci --base "origin/${{ github.base_ref }}")
          if [ "$APPROVED" = "true" ]; then args+=(--approved); fi
          uv run --no-sync python -m scripts.check_test_weakening "${args[@]}"
  core-install:
    name: core-install (${{ matrix.python-version }})
    env:
      UV_NO_SYNC: "1"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.15"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with: {enable-cache: true}
      - name: Install core test environment
        run: uv sync --python ${{ matrix.python-version }} --no-default-groups --group core-test
      - name: Verify warehouse packages are absent
        run: |
          uv run --no-sync --python ${{ matrix.python-version }} python -c '
          import importlib.util, sys
          from importlib.metadata import distributions
          forbidden = {"duckdb", "ibis-framework", "sqlglot"}
          installed = {d.metadata["Name"].lower() for d in distributions()}
          assert not forbidden & installed, sorted(forbidden & installed)
          assert not any(importlib.util.find_spec(name) is not None for name in ("duckdb", "ibis", "sqlglot"))
          print(sys.executable)
          print("\n".join(sys.path))
          '
      - name: Run README dataframe quickstart
        run: |
          uv run --no-sync --python ${{ matrix.python-version }} python -c '
          import re, warnings
          from pathlib import Path
          from increment import RunResult
          readme = Path("README.md").read_text()
          section = readme.split("## Quickstart", 1)[1].split("\n## ", 1)[0]
          code = re.search(r"```python\s*\n(.*?)\n```", section, flags=re.DOTALL)
          assert code is not None
          namespace = {}
          with warnings.catch_warnings(record=True):
              warnings.simplefilter("always")
              exec(compile(code.group(1), "README.md quickstart", "exec"), namespace)
          assert isinstance(namespace["result"], RunResult)
          assert namespace["result"].readout()
          '
      - name: Collect core tests
        run: uv run --no-sync --python ${{ matrix.python-version }} pytest --collect-only -q $(cat tests/core_modules.txt)
      - name: Run core tests
        run: uv run --no-sync --python ${{ matrix.python-version }} pytest -m "not slow" $(cat tests/core_modules.txt) --cpu-report cpu.json
      - name: Retain core CPU usage
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        continue-on-error: true
        with:
          name: cpu-core-${{ matrix.python-version }}-${{ job.check_run_id }}
          path: cpu.json
          if-no-files-found: warn
          retention-days: 90

  # Single check to require in the main-review ruleset. A matrix job reports
  # one check per entry ("test (3.12)", ...), so requiring them individually
  # means editing the ruleset every time the matrix changes.
  ci-ok:
    runs-on: ubuntu-latest
    needs: [lint, test, unit-newest, slow, exhaustive, duration-ratchet, compile-registry, tooling, build, changes, warehouse-postgres, numerical-certification, wheel-smoke-macos, wheel-smoke-windows, test-weakening, core-install]
    if: always()
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - name: Download Python 3.12 coverage shards
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          pattern: fast-coverage-3.12-shard-*-${{ github.sha }}-${{ github.run_attempt }}
          path: .coverage-shards
          if-no-artifact-found: ignore
      - name: Combine fast coverage (advisory)
        continue-on-error: true
        env:
          SHA: ${{ github.sha }}
          ATTEMPT: ${{ github.run_attempt }}
        run: |
          python3 scripts/combine_fast_coverage.py \
            --shards .coverage-shards \
            --sha "$SHA" \
            --attempt "$ATTEMPT" \
            --splits 3 \
            --output coverage/coverage.json \
            --summary-file coverage-summary.md \
            --github-output "$GITHUB_OUTPUT"
          cat coverage-summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload combined fast coverage
        if: always() && hashFiles('coverage/coverage.json') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        continue-on-error: true
        with:
          name: fast-tier executed-code coverage (in-process), Python 3.12, ${{ github.sha }}
          path: coverage/coverage.json
          if-no-files-found: ignore
      - name: Check required jobs and gate decisions
        env:
          COMPILE_REGISTRY_REQUIRED: ${{ needs.changes.outputs.compile_registry_required }}
          COMPILE_REGISTRY_RESULT: ${{ needs.compile-registry.result }}
          POSTGRES_REQUIRED: ${{ needs.changes.outputs.postgres_required }}
          POSTGRES_RESULT: ${{ needs.warehouse-postgres.result }}
          CERTIFICATION_REQUIRED: ${{ needs.changes.outputs.certification_required }}
          CERTIFICATION_RESULT: ${{ needs.numerical-certification.result }}
          EXHAUSTIVE_REQUIRED: ${{ needs.changes.outputs.exhaustive_required }}
          EXHAUSTIVE_RESULT: ${{ needs.exhaustive.result }}
          SNIPPETS_REQUIRED: ${{ needs.changes.outputs.snippets }}
          SNIPPETS_RESULT: ${{ needs.build.outputs.snippets_result || needs.build.result }}
          STRICT_DOCS_REQUIRED: ${{ needs.changes.outputs.strict_docs }}
          STRICT_DOCS_RESULT: ${{ needs.build.outputs.strict_docs_result || needs.build.result }}
          WHEEL_SMOKE_MACOS_RESULT: ${{ needs.wheel-smoke-macos.result }}
          WHEEL_SMOKE_REQUIRED: ${{ needs.changes.outputs.wheel_smoke_required }}
          WHEEL_SMOKE_WINDOWS_RESULT: ${{ needs.wheel-smoke-windows.result }}
          TEST_WEAKENING_REQUIRED: ${{ github.event_name == 'pull_request' }}
          TEST_WEAKENING_RESULT: ${{ needs.test-weakening.result }}
          UNIT_NEWEST_REQUIRED: ${{ github.event_name == 'pull_request' }}
          UNIT_NEWEST_RESULT: ${{ needs.unit-newest.result }}
          TOOLING_REQUIRED: ${{ needs.changes.outputs.tooling_required }}
          TOOLING_RESULT: ${{ needs.tooling.result }}
          CORE_INSTALL_RESULT: ${{ needs.core-install.result }}
          SLOW_REQUIRED: ${{ needs.changes.outputs.slow_required }}
          SLOW_RESULT: ${{ needs.slow.result }}
          SLOW_REASON: ${{ needs.changes.outputs.slow_reason }}
          READY_TO_MERGE: ${{ contains(github.event.pull_request.labels.*.name, 'ready-to-merge') }}
        run: |
          set -euo pipefail
          results="${{ needs.lint.result }} ${{ needs.test.result }} ${{ needs.duration-ratchet.result }} ${{ needs.build.result }} ${{ needs.changes.result }} $CORE_INSTALL_RESULT"
          echo "lint/test/build/decision/wheel-smoke jobs -> $results"
          for r in $results; do
            [ "$r" = "success" ] || { echo "::error::a required job reported '$r'"; exit 1; }
          done
          check_conditional_job() {
            required="$1"
            result="$2"
            name="$3"
            case "$required:$result" in
              true:success|false:skipped) ;;
              *) echo "::error::unexpected $name decision/result: $required:$result"; exit 1 ;;
            esac
          }
          check_conditional_job "$UNIT_NEWEST_REQUIRED" "$UNIT_NEWEST_RESULT" unit-newest
          check_conditional_job "$COMPILE_REGISTRY_REQUIRED" "$COMPILE_REGISTRY_RESULT" compile-registry
          check_conditional_job "$POSTGRES_REQUIRED" "$POSTGRES_RESULT" PostgreSQL
          check_conditional_job "$CERTIFICATION_REQUIRED" "$CERTIFICATION_RESULT" certification
          check_conditional_job "$EXHAUSTIVE_REQUIRED" "$EXHAUSTIVE_RESULT" exhaustive
          check_conditional_job "$SNIPPETS_REQUIRED" "$SNIPPETS_RESULT" documentation-snippets
          check_conditional_job "$TOOLING_REQUIRED" "$TOOLING_RESULT" tooling
          check_conditional_job "$STRICT_DOCS_REQUIRED" "$STRICT_DOCS_RESULT" strict-docs
          check_conditional_job "$WHEEL_SMOKE_REQUIRED" "$WHEEL_SMOKE_MACOS_RESULT" wheel-smoke-macos
          check_conditional_job "$WHEEL_SMOKE_REQUIRED" "$WHEEL_SMOKE_WINDOWS_RESULT" wheel-smoke-windows
          check_conditional_job "$TEST_WEAKENING_REQUIRED" "$TEST_WEAKENING_RESULT" test-weakening
          if [ "$SLOW_REQUIRED:$SLOW_RESULT" = true:skipped ] && [ "$READY_TO_MERGE" != true ]; then
            echo "::error::This change needs the slow test tier ($SLOW_REASON). Add the ready-to-merge label when the pull request is ready to merge; the tier then runs on every push until it merges."
            exit 1
          fi
          check_conditional_job "$SLOW_REQUIRED" "$SLOW_RESULT" slow
