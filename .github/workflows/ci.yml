name: ci

on:
  push: {branches: [main]}
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with: {enable-cache: true}
      - run: uv sync --group dev --extra demo --extra tables --extra dashboard
      - run: make lint
      - run: uv run ty check

  test:
    name: fast (${{ matrix.python-version }}, shard ${{ matrix.group }}/2)
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
        group: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - run: uv sync --group dev --extra demo --extra tables --extra dashboard
      - run: make test-fast PYTEST_ARGS="-n auto --dist loadgroup -p no:tach --durations=25 --evidence-root .test-evidence --splits 2 --group ${{ matrix.group }} --splitting-algorithm least_duration --durations-path .github/fast-test-durations.json"
      - name: Retain fast-suite evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fast-suite-${{ matrix.python-version }}-shard-${{ matrix.group }}-${{ github.run_attempt }}
          path: .test-evidence/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

  # Catches packaging breakage on every push/PR rather than at release time,
  # using the same gates release.yml applies before publishing.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: the version is derived from git tags.
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with: {enable-cache: true}
      - run: uv build --sdist --wheel --out-dir dist
      - run: uvx twine check --strict dist/*
      - run: uv run --with nox nox -s wheel_smoke wheel_smoke_demo
      - name: Reject artifacts with no package in them
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import glob, sys, zipfile
          whl = glob.glob("dist/*.whl")
          if not whl:
              sys.exit("::error::build produced no wheel")
          mods = [n for n in zipfile.ZipFile(whl[0]).namelist()
                  if n.startswith("increment/") and n.endswith(".py")]
          if not mods:
              sys.exit(f"::error::{whl[0]} contains no increment/*.py modules")
          print(f"{len(mods)} module(s)")
          PY

  postgres-changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      required: ${{ steps.changes.outputs.required }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {fetch-depth: 0, persist-credentials: false}
      - id: changes
        run: python scripts/postgres_ci_changes.py --event "$EVENT" --base "$BASE" --head "$HEAD" >> "$GITHUB_OUTPUT"
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}

  warehouse-postgres:
    needs: postgres-changes
    if: ${{ needs.postgres-changes.outputs.required == 'true' }}
    permissions:
      contents: read
    uses: ./.github/workflows/warehouse-backends.yml
    with: {backend_mode: postgres}

  # Single check to require in the main-review ruleset. A matrix job reports
  # one check per entry ("test (3.12)", ...), so requiring them individually
  # means editing the ruleset every time the matrix changes.
  ci-ok:
    runs-on: ubuntu-latest
    needs: [lint, test, build, postgres-changes, warehouse-postgres]
    if: always()
    steps:
      - name: Check required jobs and the PostgreSQL decision
        env:
          POSTGRES_REQUIRED: ${{ needs.postgres-changes.outputs.required }}
          POSTGRES_RESULT: ${{ needs.warehouse-postgres.result }}
        run: |
          set -euo pipefail
          results="${{ needs.lint.result }} ${{ needs.test.result }} ${{ needs.build.result }} ${{ needs.postgres-changes.result }}"
          echo "lint/test/build/postgres-changes -> $results"
          for r in $results; do
            [ "$r" = "success" ] || { echo "::error::a required job reported '$r'"; exit 1; }
          done
          case "$POSTGRES_REQUIRED:$POSTGRES_RESULT" in
            true:success|false:skipped) ;;
            *) echo "::error::unexpected PostgreSQL decision/result: $POSTGRES_REQUIRED:$POSTGRES_RESULT"; exit 1 ;;
          esac
