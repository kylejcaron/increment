name: ci

on:
  workflow_dispatch:
    inputs:
      coverage:
        description: "Collect coverage for the Python 3.12 fast-test shards"
        type: boolean
        default: true
        required: true
  push: {branches: [main]}
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with: {enable-cache: true}
      - run: uv sync --group dev --extra demo --extra tables --extra dashboard
      - run: uv run python scripts/check_doc_references.py --check --collect
      - run: uv run python scripts/render_capability_table.py --check
      - run: make lint
      - run: uv run --no-sync python scripts/import_reach.py --summary
      - run: uv run ty check

  test:
    name: fast (${{ matrix.python-version }}, shard ${{ matrix.group }}/${{ matrix.splits }})
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      # Pull requests run Python 3.14 in two shards, like 3.12: one shard holds the
      # whole fast tier (~15 min) and hits this job's timeout during upload.
      matrix:
        include: ${{ fromJSON(github.event_name == 'pull_request' && '[{"python-version":"3.12","group":1,"splits":2},{"python-version":"3.12","group":2,"splits":2},{"python-version":"3.14","group":1,"splits":2},{"python-version":"3.14","group":2,"splits":2}]' || '[{"python-version":"3.12","group":1,"splits":2},{"python-version":"3.12","group":2,"splits":2},{"python-version":"3.13","group":1,"splits":2},{"python-version":"3.13","group":2,"splits":2},{"python-version":"3.14","group":1,"splits":2},{"python-version":"3.14","group":2,"splits":2}]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {fetch-depth: 0, persist-credentials: false}
      - uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - run: uv sync --group dev --extra demo --extra tables --extra dashboard
      - id: fast-tests
        run: |
          coverage_enabled="${{ github.event_name == 'push' || (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'test-reduction-approved')) || (github.event_name == 'workflow_dispatch' && inputs.coverage) }}"
          coverage_args=""
          if [ "${{ matrix.python-version }}" = "3.12" ] && [ "$coverage_enabled" = "true" ]; then
            export COVERAGE_CORE=sysmon
            coverage_args="--cov=increment --cov-report=json:coverage.json"
          fi
          make test-fast WORKERS=auto PYTEST_ARGS="--durations=25 --junitxml=junit.xml --splits ${{ matrix.splits }} --group ${{ matrix.group }} --splitting-algorithm least_duration --durations-path .github/fast-test-durations.json $coverage_args"
      - name: Predict selected files
        if: always()
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          uv run --no-sync python -m pytest -m "not slow and not parameter_recovery and not numerical_certification and not examples and not stress" --co -q --tach-base "$BASE" --affected-tier fast --affected-report affected-report.json --splits ${{ matrix.splits }} --group ${{ matrix.group }} --splitting-algorithm least_duration tests
      - name: Retain selection prediction
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: affected-report-${{ matrix.python-version }}-${{ matrix.group }}-${{ github.run_attempt }}
          path: affected-report.json
          if-no-files-found: warn
          retention-days: 90
      - name: Record fast coverage shard metadata
        if: always() && matrix.python-version == '3.12'
        env:
          SHA: ${{ github.sha }}
          ATTEMPT: ${{ github.run_attempt }}
          SHARD: ${{ matrix.group }}
          TEST_OUTCOME: ${{ steps.fast-tests.outcome }}
        run: |
          mkdir -p .fast-coverage
          python -c 'import json, os; from pathlib import Path; Path(".fast-coverage/metadata.json").write_text(json.dumps({"sha": os.environ["SHA"], "attempt": int(os.environ["ATTEMPT"]), "python": "3.12", "shard": int(os.environ["SHARD"]), "outcome": os.environ["TEST_OUTCOME"]}) + "\n")'
          if [ -f coverage.json ]; then cp coverage.json .fast-coverage/coverage.json; fi
      - name: Retain fast coverage shard
        if: always() && matrix.python-version == '3.12'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        continue-on-error: true
        with:
          name: fast-coverage-3.12-shard-${{ matrix.group }}-${{ github.sha }}-${{ github.run_attempt }}
          path: .fast-coverage/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30
      - name: Retain fast JUnit report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fast-junit-${{ matrix.python-version }}-shard-${{ matrix.group }}-${{ github.run_attempt }}
          path: junit.xml
          if-no-files-found: warn
          retention-days: 30

  selection-misses:
    name: report selection misses
    if: always()
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {fetch-depth: 0, persist-credentials: false}
      - uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with: {enable-cache: true, python-version: "3.12"}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: fast-junit-*
          path: selection-input/junit
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: affected-report-*
          path: selection-input/affected
      - name: Merge predictions and report misses
        if: always()
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python - <<'PY'
          import os
          import json
          from pathlib import Path
          reports = sorted(Path("selection-input/affected").rglob("*.json"))
          merged = {}
          for report in reports:
              try:
                  merged.update(json.loads(report.read_text()))
              except (OSError, ValueError):
                  pass
          expected = 4 if os.environ["EVENT_NAME"] == "pull_request" else 6
          if len(reports) != expected:
              merged["__incomplete__"] = True
          Path("affected-report.json").write_text(json.dumps(merged) + "\n")
          PY
          shopt -s globstar nullglob
          junit=(selection-input/junit/**/*.xml)
          uv run --no-sync python scripts/selection_map.py misses --base "$BASE" --head "$HEAD" --junit "${junit[@]}" --report affected-report.json | tee selection-misses.txt
          cat selection-misses.txt >> "$GITHUB_STEP_SUMMARY"
      - name: Retain selection miss report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: selection-misses-${{ github.run_attempt }}
          path: selection-misses.txt
          if-no-files-found: warn
          retention-days: 90
  slow:
    name: functional slow (3.12, shard ${{ matrix.group }}/6)
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        group: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {fetch-depth: 0, persist-credentials: false}
      - uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with:
          enable-cache: true
          python-version: "3.12"
      - run: uv sync --group dev --extra demo --extra tables --extra dashboard
      - run: make test-slow WORKERS=auto PYTEST_ARGS="--durations=25 --junitxml=junit.xml --splits 6 --group ${{ matrix.group }} --splitting-algorithm least_duration --durations-path .github/slow-test-durations.json"
      - name: Retain slow JUnit report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: slow-junit-shard-${{ matrix.group }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: junit.xml
          if-no-files-found: warn
          retention-days: 30

  compile-registry:
    name: warehouse compile registry
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {fetch-depth: 0, persist-credentials: false}
      - uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with:
          enable-cache: true
          python-version: "3.12"
      - run: uv sync --group dev --extra demo --extra tables --extra dashboard
      - id: key
        run: |
          value=$(uv run --no-sync python -c 'from integration.warehouse_execution._compile import _captured_compile_cache_key; print(_captured_compile_cache_key("snowflake").removeprefix("snowflake-"))')
          echo "value=$value" >> "$GITHUB_OUTPUT"
      - name: Restore or save compiled warehouse registry
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .pytest_cache/warehouse_compile_registry
          key: compile-registry-${{ steps.key.outputs.value }}
      - run: make test-tier TIER=compile-registry WORKERS=auto PYTEST_ARGS="--durations=25"

  # Catches packaging breakage on every push/PR rather than at release time,
  # using the same gates release.yml applies before publishing.
  # Also builds the documentation when changed paths require it, saving a job.
  build:
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      snippets_result: ${{ steps.snippets.outcome }}
      strict_docs_result: ${{ steps.strict-docs.outcome }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: the version is derived from git tags.
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with: {enable-cache: true}
      - run: uv build --sdist --wheel --out-dir dist
      - run: uvx twine check --strict dist/*
      - run: uv run --with nox nox -s wheel_smoke wheel_smoke_demo
      - name: Reject artifacts with no package in them
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import glob, sys, zipfile
          whl = glob.glob("dist/*.whl")
          if not whl:
              sys.exit("::error::build produced no wheel")
          mods = [n for n in zipfile.ZipFile(whl[0]).namelist()
                  if n.startswith("increment/") and n.endswith(".py")]
          if not mods:
              sys.exit(f"::error::{whl[0]} contains no increment/*.py modules")
          print(f"{len(mods)} module(s)")
          PY
      - id: snippets
        if: ${{ needs.changes.outputs.snippets == 'true' }}
        run: uv run --with nox nox -s docs_snippets
      - id: strict-docs
        if: ${{ always() && needs.changes.outputs.strict_docs == 'true' }}
        run: uv run --with nox nox -s docs

  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      postgres_required: ${{ steps.postgres.outputs.required }}
      certification_required: ${{ steps.certification.outputs.required }}
      wheel_smoke_required: ${{ steps.packaging.outputs.required }}
      snippets: ${{ steps.docs.outputs.snippets }}
      strict_docs: ${{ steps.docs.outputs.strict_docs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {fetch-depth: 0, persist-credentials: false}
      - id: postgres
        run: python scripts/postgres_ci_changes.py --event "$EVENT" --base "$BASE" --head "$HEAD" >> "$GITHUB_OUTPUT"
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
      - id: certification
        run: python scripts/certification_ci_changes.py --event "$EVENT" --base "$BASE" --head "$HEAD" >> "$GITHUB_OUTPUT"
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
      - id: packaging
        run: python scripts/packaging_ci_changes.py --event "$EVENT" --base "$BASE" --head "$HEAD" >> "$GITHUB_OUTPUT"
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
      - id: docs
        run: python scripts/docs_ci_changes.py --event "$EVENT" --base "$BASE" --head "$HEAD" --labels "$LABELS" >> "$GITHUB_OUTPUT"
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}

  numerical-certification:
    name: numerical certification (shard ${{ matrix.group }}/2)
    needs: [lint, changes]
    if: ${{ needs.changes.outputs.certification_required == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        group: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {fetch-depth: 0, persist-credentials: false}
      - uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with: {enable-cache: true, python-version: "3.12"}
      - run: uv sync --group dev --extra demo --extra tables --extra dashboard
      - run: make test-numerical-certification WORKERS=auto PYTEST_ARGS="--durations=25 --junitxml=junit.xml --splits 2 --group ${{ matrix.group }} --splitting-algorithm least_duration --durations-path .github/certification-test-durations.json"
      - name: Retain certification JUnit report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: numerical-certification-junit-shard-${{ matrix.group }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: junit.xml
          if-no-files-found: warn
          retention-days: 30

  warehouse-postgres:
    needs: changes
    if: ${{ needs.changes.outputs.postgres_required == 'true' }}
    permissions:
      contents: read
    uses: ./.github/workflows/warehouse-backends.yml
    with:
      backend_mode: postgres
      postgres_shards: 3

  wheel-smoke-macos:
    needs: changes
    if: ${{ needs.changes.outputs.wheel_smoke_required == 'true' }}
    runs-on: macos-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with:
          enable-cache: true
          python-version: "3.12"
      - run: uv build --wheel --out-dir dist
      - run: uv run --with nox nox -s wheel_smoke wheel_smoke_demo

  wheel-smoke-windows:
    needs: changes
    if: ${{ needs.changes.outputs.wheel_smoke_required == 'true' }}
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with:
          enable-cache: true
          python-version: "3.12"
      - run: uv build --wheel --out-dir dist
      - run: uv run --with nox nox -s wheel_smoke wheel_smoke_demo

  test-weakening:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {fetch-depth: 0, persist-credentials: false}
      - uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with: {enable-cache: true}
      - run: uv sync --group dev --extra demo --extra tables --extra dashboard
      - name: Check for weakened tests
        env:
          APPROVED: ${{ contains(github.event.pull_request.labels.*.name, 'test-reduction-approved') }}
        run: |
          args=(--ci --base "origin/${{ github.base_ref }}")
          if [ "$APPROVED" = "true" ]; then args+=(--approved); fi
          uv run --no-sync python -m scripts.check_test_weakening "${args[@]}"
  # Single check to require in the main-review ruleset. A matrix job reports
  # one check per entry ("test (3.12)", ...), so requiring them individually
  # means editing the ruleset every time the matrix changes.
  ci-ok:
    runs-on: ubuntu-latest
    needs: [lint, test, slow, compile-registry, build, changes, warehouse-postgres, numerical-certification, wheel-smoke-macos, wheel-smoke-windows, test-weakening]
    if: always()
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - name: Download Python 3.12 coverage shards
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        continue-on-error: true
        with:
          pattern: fast-coverage-3.12-shard-*-${{ github.sha }}-${{ github.run_attempt }}
          path: .coverage-shards
          if-no-artifact-found: ignore
      - name: Combine fast coverage (advisory)
        continue-on-error: true
        env:
          SHA: ${{ github.sha }}
          ATTEMPT: ${{ github.run_attempt }}
        run: |
          python3 scripts/combine_fast_coverage.py \
            --shards .coverage-shards \
            --sha "$SHA" \
            --attempt "$ATTEMPT" \
            --output coverage/coverage.json \
            --summary-file coverage-summary.md \
            --github-output "$GITHUB_OUTPUT"
          cat coverage-summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload combined fast coverage
        if: always() && hashFiles('coverage/coverage.json') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        continue-on-error: true
        with:
          name: fast-tier executed-code coverage (in-process), Python 3.12, ${{ github.sha }}
          path: coverage/coverage.json
          if-no-files-found: ignore
      - name: Check required jobs and gate decisions
        env:
          POSTGRES_REQUIRED: ${{ needs.changes.outputs.postgres_required }}
          POSTGRES_RESULT: ${{ needs.warehouse-postgres.result }}
          CERTIFICATION_REQUIRED: ${{ needs.changes.outputs.certification_required }}
          CERTIFICATION_RESULT: ${{ needs.numerical-certification.result }}
          SNIPPETS_REQUIRED: ${{ needs.changes.outputs.snippets }}
          SNIPPETS_RESULT: ${{ needs.build.outputs.snippets_result || needs.build.result }}
          STRICT_DOCS_REQUIRED: ${{ needs.changes.outputs.strict_docs }}
          STRICT_DOCS_RESULT: ${{ needs.build.outputs.strict_docs_result || needs.build.result }}
          WHEEL_SMOKE_MACOS_RESULT: ${{ needs.wheel-smoke-macos.result }}
          WHEEL_SMOKE_REQUIRED: ${{ needs.changes.outputs.wheel_smoke_required }}
          WHEEL_SMOKE_WINDOWS_RESULT: ${{ needs.wheel-smoke-windows.result }}
          TEST_WEAKENING_REQUIRED: ${{ github.event_name == 'pull_request' }}
          TEST_WEAKENING_RESULT: ${{ needs.test-weakening.result }}
        run: |
          set -euo pipefail
          results="${{ needs.lint.result }} ${{ needs.test.result }} ${{ needs.slow.result }} ${{ needs.compile-registry.result }} ${{ needs.build.result }} ${{ needs.changes.result }}"
          echo "lint/test/slow/compile-registry/build/decision/wheel-smoke jobs -> $results"
          for r in $results; do
            [ "$r" = "success" ] || { echo "::error::a required job reported '$r'"; exit 1; }
          done
          check_conditional_job() {
            required="$1"
            result="$2"
            name="$3"
            case "$required:$result" in
              true:success|false:skipped) ;;
              *) echo "::error::unexpected $name decision/result: $required:$result"; exit 1 ;;
            esac
          }
          check_conditional_job "$POSTGRES_REQUIRED" "$POSTGRES_RESULT" PostgreSQL
          check_conditional_job "$CERTIFICATION_REQUIRED" "$CERTIFICATION_RESULT" certification
          check_conditional_job "$SNIPPETS_REQUIRED" "$SNIPPETS_RESULT" documentation-snippets
          check_conditional_job "$STRICT_DOCS_REQUIRED" "$STRICT_DOCS_RESULT" strict-docs
          check_conditional_job "$WHEEL_SMOKE_REQUIRED" "$WHEEL_SMOKE_MACOS_RESULT" wheel-smoke-macos
          check_conditional_job "$WHEEL_SMOKE_REQUIRED" "$WHEEL_SMOKE_WINDOWS_RESULT" wheel-smoke-windows
          check_conditional_job "$TEST_WEAKENING_REQUIRED" "$TEST_WEAKENING_RESULT" test-weakening
