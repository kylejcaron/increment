name: ci

on:
  push: {branches: [main]}
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with: {enable-cache: true}
      - run: uv sync --group dev --extra demo --extra tables --extra dashboard
      - run: uv run python scripts/check_doc_references.py --check --collect
      - run: uv run python scripts/render_capability_table.py --check
      - run: make lint
      - run: uv run ty check

  test:
    name: fast (${{ matrix.python-version }}, shard ${{ matrix.group }}/2)
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
        group: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {fetch-depth: 0, persist-credentials: false}
      - uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - run: uv sync --group dev --extra demo --extra tables --extra dashboard
      - id: fast-tests
        run: |
          coverage_args=""
          if [ "${{ matrix.python-version }}" = "3.12" ]; then
            export COVERAGE_CORE=sysmon
            coverage_args="--cov=increment --cov-report=json:.test-evidence/fast-coverage.json"
          fi
          make test-fast PYTEST_ARGS="-n auto --dist loadgroup --durations=25 --evidence-root .test-evidence --splits 2 --group ${{ matrix.group }} --splitting-algorithm least_duration --durations-path .github/fast-test-durations.json $coverage_args"
      - name: Report fast-suite runtime
        if: always() && hashFiles('.test-evidence/run-*/run.json') != ''
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          PYTHON_VERSION: ${{ matrix.python-version }}
        run: |
          args=()
          if [ "$PYTHON_VERSION" = "3.13" ]; then
            # The weights come from 3.13; 3.12 uses coverage instrumentation and 3.14 is a different interpreter.
            args+=(--duration-baseline .github/fast-test-durations.json)
          fi
          if [ -n "$BASE_SHA" ] && [ "$BASE_SHA" != "0000000000000000000000000000000000000000" ]; then
            args+=(--base "$BASE_SHA")
          fi
          uv run --no-sync python -m scripts.report_test_runtime .test-evidence "${args[@]}" --json .test-evidence/runtime-fast.json --markdown "$GITHUB_STEP_SUMMARY"
      - name: Record fast coverage shard receipt
        if: always() && matrix.python-version == '3.12'
        env:
          SHA: ${{ github.sha }}
          ATTEMPT: ${{ github.run_attempt }}
          SHARD: ${{ matrix.group }}
          TEST_OUTCOME: ${{ steps.fast-tests.outcome }}
        run: |
          mkdir -p .fast-coverage
          python -c 'import json, os; from pathlib import Path; Path(".fast-coverage/metadata.json").write_text(json.dumps({"sha": os.environ["SHA"], "attempt": int(os.environ["ATTEMPT"]), "python": "3.12", "shard": int(os.environ["SHARD"]), "outcome": os.environ["TEST_OUTCOME"]}) + "\n")'
          if [ -f .test-evidence/fast-coverage.json ]; then cp .test-evidence/fast-coverage.json .fast-coverage/coverage.json; fi
      - name: Retain fast coverage shard
        if: always() && matrix.python-version == '3.12'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        continue-on-error: true
        with:
          name: fast-coverage-3.12-shard-${{ matrix.group }}-${{ github.sha }}-${{ github.run_attempt }}
          path: .fast-coverage/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30
      - name: Retain fast-suite evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fast-suite-${{ matrix.python-version }}-shard-${{ matrix.group }}-${{ github.run_attempt }}
          path: .test-evidence/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
  fast-coverage:
    name: fast-tier coverage (3.12, optional)
    needs: test
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - name: Download Python 3.12 coverage shards
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: fast-coverage-3.12-shard-*-${{ github.sha }}-${{ github.run_attempt }}
          path: .coverage-shards
          if-no-artifact-found: ignore
      - id: combine
        name: Combine only a complete matching pair
        env:
          SHA: ${{ github.sha }}
          ATTEMPT: ${{ github.run_attempt }}
        run: |
          python3 scripts/combine_fast_coverage.py \
            --shards .coverage-shards \
            --sha "$SHA" \
            --attempt "$ATTEMPT" \
            --output coverage/coverage.json \
            --summary-file coverage-summary.md \
            --github-output "$GITHUB_OUTPUT"
          cat coverage-summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload complete fast-tier coverage
        if: steps.combine.outputs.complete == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fast-tier executed-code coverage (in-process), Python 3.12, ${{ github.sha }}
          path: coverage/coverage.json
          if-no-files-found: error
          retention-days: 30

  slow:
    name: functional slow (3.12, shard ${{ matrix.group }}/4)
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        group: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {fetch-depth: 0, persist-credentials: false}
      - uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with:
          enable-cache: true
          python-version: "3.12"
      - run: uv sync --group dev --extra demo --extra tables --extra dashboard
      - run: make test-slow PYTEST_ARGS="-n auto --dist loadgroup --evidence-root .test-evidence --splits 4 --group ${{ matrix.group }} --splitting-algorithm least_duration --store-durations --durations-path .test-evidence/slow-test-durations.json"
      - name: Report slow-suite runtime
        if: always() && hashFiles('.test-evidence/run-*/run.json') != ''
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          args=()
          if [ -n "$BASE_SHA" ] && [ "$BASE_SHA" != "0000000000000000000000000000000000000000" ]; then
            args+=(--base "$BASE_SHA")
          fi
          uv run --no-sync python -m scripts.report_test_runtime .test-evidence "${args[@]}" --json .test-evidence/runtime-slow.json --markdown "$GITHUB_STEP_SUMMARY"
      - name: Retain slow-suite evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: slow-suite-shard-${{ matrix.group }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .test-evidence/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

  # Catches packaging breakage on every push/PR rather than at release time,
  # using the same gates release.yml applies before publishing.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: the version is derived from git tags.
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with: {enable-cache: true}
      - run: uv build --sdist --wheel --out-dir dist
      - run: uvx twine check --strict dist/*
      - run: uv run --with nox nox -s wheel_smoke wheel_smoke_demo
      - name: Reject artifacts with no package in them
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import glob, sys, zipfile
          whl = glob.glob("dist/*.whl")
          if not whl:
              sys.exit("::error::build produced no wheel")
          mods = [n for n in zipfile.ZipFile(whl[0]).namelist()
                  if n.startswith("increment/") and n.endswith(".py")]
          if not mods:
              sys.exit(f"::error::{whl[0]} contains no increment/*.py modules")
          print(f"{len(mods)} module(s)")
          PY

  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      postgres_required: ${{ steps.postgres.outputs.required }}
      certification_required: ${{ steps.certification.outputs.required }}
      snippets: ${{ steps.docs.outputs.snippets }}
      strict_docs: ${{ steps.docs.outputs.strict_docs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {fetch-depth: 0, persist-credentials: false}
      - id: postgres
        run: python scripts/postgres_ci_changes.py --event "$EVENT" --base "$BASE" --head "$HEAD" >> "$GITHUB_OUTPUT"
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
      - id: certification
        run: python scripts/certification_ci_changes.py --event "$EVENT" --base "$BASE" --head "$HEAD" >> "$GITHUB_OUTPUT"
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
      - id: docs
        run: python scripts/docs_ci_changes.py --event "$EVENT" --base "$BASE" --head "$HEAD" --labels "$LABELS" >> "$GITHUB_OUTPUT"
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}

  numerical-certification:
    name: numerical certification
    needs: [lint, changes]
    if: ${{ needs.changes.outputs.certification_required == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {fetch-depth: 0, persist-credentials: false}
      - uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with: {enable-cache: true, python-version: "3.12"}
      - run: uv sync --group dev --extra demo --extra tables --extra dashboard
      - run: make test-numerical-certification PYTEST_ARGS="-n auto --dist loadgroup -p no:tach --evidence-root .test-evidence"
      - name: Report certification runtime
        if: always() && hashFiles('.test-evidence/run-*/run.json') != ''
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          args=()
          if [ -n "$BASE_SHA" ] && [ "$BASE_SHA" != "0000000000000000000000000000000000000000" ]; then
            args+=(--base "$BASE_SHA")
          fi
          uv run --no-sync python -m scripts.report_test_runtime .test-evidence "${args[@]}" --json .test-evidence/runtime-certification.json --markdown "$GITHUB_STEP_SUMMARY"
      - name: Retain certification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: numerical-certification-${{ github.run_id }}-${{ github.run_attempt }}
          path: .test-evidence/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

  docs:
    name: documentation
    needs: changes
    if: ${{ needs.changes.outputs.snippets == 'true' || needs.changes.outputs.strict_docs == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      snippets_result: ${{ steps.snippets.outcome }}
      strict_docs_result: ${{ steps.strict-docs.outcome }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with: {enable-cache: true}
      - id: snippets
        if: ${{ needs.changes.outputs.snippets == 'true' }}
        run: uv run --with nox nox -s docs_snippets
      - id: strict-docs
        if: ${{ always() && needs.changes.outputs.strict_docs == 'true' }}
        run: uv run --with nox nox -s docs

  warehouse-postgres:
    needs: changes
    if: ${{ needs.changes.outputs.postgres_required == 'true' }}
    permissions:
      contents: read
    uses: ./.github/workflows/warehouse-backends.yml
    with:
      backend_mode: postgres
      postgres_shards: 1

  wheel-smoke-macos:
    runs-on: macos-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with:
          enable-cache: true
          python-version: "3.12"
      - run: uv build --wheel --out-dir dist
      - run: uv run --with nox nox -s wheel_smoke wheel_smoke_demo

  wheel-smoke-windows:
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with:
          enable-cache: true
          python-version: "3.12"
      - run: uv build --wheel --out-dir dist
      - run: uv run --with nox nox -s wheel_smoke wheel_smoke_demo

  # Single check to require in the main-review ruleset. A matrix job reports
  # one check per entry ("test (3.12)", ...), so requiring them individually
  # means editing the ruleset every time the matrix changes.
  ci-ok:
    runs-on: ubuntu-latest
    needs: [lint, test, slow, build, changes, warehouse-postgres, numerical-certification, docs, wheel-smoke-macos, wheel-smoke-windows]
    if: always()
    steps:
      - name: Check required jobs and gate decisions
        env:
          POSTGRES_REQUIRED: ${{ needs.changes.outputs.postgres_required }}
          POSTGRES_RESULT: ${{ needs.warehouse-postgres.result }}
          CERTIFICATION_REQUIRED: ${{ needs.changes.outputs.certification_required }}
          CERTIFICATION_RESULT: ${{ needs.numerical-certification.result }}
          SNIPPETS_REQUIRED: ${{ needs.changes.outputs.snippets }}
          SNIPPETS_RESULT: ${{ needs.docs.outputs.snippets_result || needs.docs.result }}
          STRICT_DOCS_REQUIRED: ${{ needs.changes.outputs.strict_docs }}
          STRICT_DOCS_RESULT: ${{ needs.docs.outputs.strict_docs_result || needs.docs.result }}
          WHEEL_SMOKE_MACOS_RESULT: ${{ needs.wheel-smoke-macos.result }}
          WHEEL_SMOKE_WINDOWS_RESULT: ${{ needs.wheel-smoke-windows.result }}
        run: |
          set -euo pipefail
          results="${{ needs.lint.result }} ${{ needs.test.result }} ${{ needs.slow.result }} ${{ needs.build.result }} ${{ needs.changes.result }} $WHEEL_SMOKE_MACOS_RESULT $WHEEL_SMOKE_WINDOWS_RESULT"
          echo "lint/test/slow/build/decision/wheel-smoke jobs -> $results"
          for r in $results; do
            [ "$r" = "success" ] || { echo "::error::a required job reported '$r'"; exit 1; }
          done
          check_conditional_job() {
            required="$1"
            result="$2"
            name="$3"
            case "$required:$result" in
              true:success|false:skipped) ;;
              *) echo "::error::unexpected $name decision/result: $required:$result"; exit 1 ;;
            esac
          }
          check_conditional_job "$POSTGRES_REQUIRED" "$POSTGRES_RESULT" PostgreSQL
          check_conditional_job "$CERTIFICATION_REQUIRED" "$CERTIFICATION_RESULT" certification
          check_conditional_job "$SNIPPETS_REQUIRED" "$SNIPPETS_RESULT" documentation-snippets
          check_conditional_job "$STRICT_DOCS_REQUIRED" "$STRICT_DOCS_RESULT" strict-docs
