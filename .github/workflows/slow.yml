name: slow-tests

on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions: {}

env:
  UV_LOCKED: "1"

jobs:
  slow:
    name: functional slow tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with: {enable-cache: true, python-version: "3.12"}
      - run: uv sync --group dev --extra demo --extra tables --extra dashboard
      - run: make test-slow
