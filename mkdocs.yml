site_name: increment
site_description: Open-source Python library for A/B test analysis, from dataframes or SQL warehouses.
repo_url: https://github.com/kylejcaron/increment
repo_name: kylejcaron/increment
exclude_docs: |
  superpowers/
  proposals/
  templates/

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

plugins:
  - search
  - mkdocstrings:
      custom_templates: docs/templates
      handlers:
        python:
          options:
            docstring_style: numpy
            docstring_options:
              warn_unknown_params: false
            extensions:
              - griffe_pydantic
            show_source: false
            show_root_heading: true
            members_order: source
            separate_signature: true
            signature_crossrefs: true

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.superfences
  - pymdownx.arithmatex:
      generic: true
  - toc:
      permalink: true

extra_css:
  - stylesheets/compatibility.css

extra_javascript:
  - javascripts/compatibility.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js
validation:
  links:
    anchors: warn

