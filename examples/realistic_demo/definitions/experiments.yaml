# ── Experiments ───────────────────────────────────────────────────────────

experiments:
  - name: checkout_redesign
    description: "A streamlined one-page checkout increases purchase conversion without hurting short-term retention."
    exposure: checkout_trigger
    unit: user_id
    start: 2025-01-15
    end: 2025-02-14
    n_pre_periods: 0
    control_group: control
    allocation:
      control: 0.5
      treatment: 0.5
    allocation_scheme: independent
    plan:
      # This joint report includes a quantile guardrail: use fixed-horizon inference.
      view_multiplicity:
        correction: bonferroni
      primary: conversion_rate
      secondaries:
        - revenue_per_user
        - average_order_value
      guardrails:
        # Each guardrail checks the treatment is not worse than control by its
        # margin or more: a 2% relative loss of D7 retention, a 5% relative rise
        # in checkout latency.
        - metric: d7_retention
          margin: 0.02
        - metric: checkout_latency_ms
          margin: 0.05
    breakouts:
      - property: country
        source: web_events
      - property: plan
        source: web_events

  # Assigned on the first visit; only users who later reach checkout can see
  # the button. Declaring the trigger reports the assigned population and the
  # triggered one separately.
  - name: express_checkout
    description: "One-tap express pay on the checkout page increases purchase conversion among users who reach checkout."
    exposure: assignment
    trigger: checkout_trigger
    unit: user_id
    start: 2025-01-20
    end: 2025-02-14
    n_pre_periods: 0
    control_group: control
    allocation:
      control: 0.5
      treatment: 0.5
    allocation_scheme: independent
    plan:
      primary: conversion_rate
      secondaries:
        - revenue_per_user
