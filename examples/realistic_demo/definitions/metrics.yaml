# ── Metrics ───────────────────────────────────────────────────────────────

metric_definitions:
  file: shop.metrics.yaml
  use: [average_order_value]
  sources: {orders: orders}
  measures: {revenue: order, order_count: order}
  metrics:
    average_order_value:
      description: "Average value of observed orders: total revenue / total orders"
      entity: user
      preferred_direction: increase
      window_days: null

metrics:
  # Primary
  - type: conversion
    name: conversion_rate
    description: "Completed order within 14 days of assignment, or first trigger in the Triggered population"
    entity: user_id
    preferred_direction: increase
    fact: order
    window_days: 14

  # Secondary
  - type: mean
    name: revenue_per_user
    description: "Revenue per user during the first 14 days from assignment, or first trigger in the Triggered population"
    entity: user_id
    preferred_direction: increase
    fact: order
    aggregation: sum
    window_days: 14

  # Guardrails
  - type: retention
    name: d7_retention
    description: "A return during days 7-13 from assignment, or first trigger in the Triggered population"
    entity: user_id
    preferred_direction: increase
    fact: page_view
    threshold_days: [7, 14]

  - type: ratio
    name: checkout_latency_ms
    description: "Event-weighted mean checkout page load latency (lower is better)"
    entity: user_id
    preferred_direction: decrease
    numerator:
      fact: page_load
      aggregation: sum
      window_days: null
      filters:
        - property: page
          op: equals
          values: ["/checkout"]
    denominator:
      fact: page_load
      aggregation: count
      window_days: null
      filters:
        - property: page
          op: equals
          values: ["/checkout"]

  # Saved definitions the checkout experiment does not declare; the dashboard can add them
  # to Explore as exploratory metrics.
  - type: mean
    name: orders_per_user
    description: "Orders per user during the first 14 days from assignment, or first trigger in the Triggered population"
    entity: user_id
    preferred_direction: increase
    fact: order
    aggregation: count
    window_days: 14

  - type: mean
    name: page_views_per_user
    description: "Observed page views per user"
    entity: user_id
    preferred_direction: increase
    fact: page_view
    aggregation: count
    window_days: null

  - type: mean
    name: checkout_loads_per_user
    description: "Observed checkout page loads per user"
    entity: user_id
    preferred_direction: decrease
    fact: page_load
    aggregation: count
    window_days: null
    filters:
      - property: page
        op: equals
        values: ["/checkout"]
