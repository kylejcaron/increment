[project]
name = "increment"
dynamic = ["version"]
description = "Open-source Python library for A/B test analysis, from dataframes or SQL warehouses."
keywords = [
    "python",
    "a-b-testing",
    "A/B testing",
    "experimentation",
    "causal inference",
    "statistics",
    "data analysis",
    "power analysis",
    "CUPED",
    "sequential testing",
    "experiment analysis",
    "ibis",
    "SQL",
    "data warehouse",
]
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "Kyle Caron", email = "kyle.j.caron@gmail.com" }]
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.14.1",
    # Ibis's compiler registry imports packaging even without backend extras.
    "packaging>=24.0",
    # PyYAML gained CPython 3.13 support in 6.0.2 and 3.14 in 6.0.3, so a
    # single bound would advertise a minimum that cannot be exercised by the
    # floor session. Kept in step with noxfile's FLOOR_PINS.
    "pyyaml>=6.0.1; python_version < '3.13'",
    "pyyaml>=6.0.2; python_version == '3.13'",
    "pyyaml>=6.0.3; python_version >= '3.14'",
    "numpy>=2.5.4",
    "scipy>=1.18.1",
    "narwhals>=2.27.1",
    # Arrow 23.0.1 is the security floor; 25.0.0 crashes after its loading thread exits.
    # Exclude the broken release rather than changing process-wide allocators.
    "pyarrow!=25.0.0,>=26.0.0; python_version < '3.13'",
    "pyarrow!=25.0.0,>=26.0.0; python_version == '3.13'",
    "pyarrow!=25.0.0,>=26.0.0; python_version >= '3.14'",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
]

[project.urls]
Homepage = "https://getincrement.io/"
Documentation = "https://getincrement.io/docs/"
Repository = "https://github.com/kylejcaron/increment"

[project.entry-points."increment.cate_operations"]
core = "increment.cate:core_operations"

[project.entry-points."increment.program_store"]
core = "increment.store:core_operations"

[project.optional-dependencies]
warehouse = [
    "ibis-framework>=10.1.0; python_version < '3.14'",
    # Ibis 10.1 imports duckdb.functional, but no DuckDB release that both
    # exposes that module and ships CPython 3.14 wheels exists.
    "ibis-framework>=11.0.0; python_version >= '3.14'",
    # Ibis 12 reads the deprecated pandas 3.1 future.infer_string option,
    # which raises under this project's warnings-as-errors policy.
    "pandas>=3.0.5,<3.1",
    # Ibis 12's DuckDB cleanup Drop(this=...) is malformed with SQLGlot 30.18–30.27 and 30.29.
    # Reassess these SDK-incompatible releases when a stable Ibis fix is published.
    "sqlglot>=30.14,!=30.18.0,!=30.19.0,!=30.20.0,!=30.21.0,!=30.22.0,!=30.23.0,!=30.24.0,!=30.25.0,!=30.26.0,!=30.27.0,!=30.29.0,!=30.30.0",
]
demo   = [
    "increment[warehouse]",
    # Ibis 12 still calls DuckDB's removed `fetch_arrow_table()` method.
    # Reassess this exact release exclusion after the upstream adapter is updated.
    "duckdb!=2.0.0",
    "ibis-framework[duckdb]>=10.1.0; python_version < '3.14'",
    "ibis-framework[duckdb]>=12.0.0; python_version >= '3.14'",
]
tables = ["coeftable>=0.13.1", "pandas>=3.0.5"]
# Optional presentation layer for `increment.dashboard`. Core Increment,
# estimation, power, and the dataframe entry points never import these.
dashboard = [
    "marimo>=0.25.2",
    "coeftable>=0.13.1",
    "pandas>=3.0.5,<3.1",
    "anywidget>=0.9",
]

[build-system]
requires = ["hatchling>=1.32.4", "hatch-vcs>=0.5"]
build-backend = "hatchling.build"

[project.entry-points."increment.artifact_ports"]
builtin = "increment.artifacts._query:artifact_query_ports"

[dependency-groups]
dev = [
    "ruff>=0.17.2",
    "prek>=0.5.7",
    "marimo>=0.25.2",
    "altair>=6.3.0",
    "pytest==9.2.0",
    # ty 0.0.91 emits hundreds of new diagnostics across existing code/tests;
    # hold at 0.0.64 until the stricter checks are adopted incrementally (2026-10-28).
    "ty>=0.0.64,<0.0.65",
    "pytest-cov>=6.0",
    # pytest 9.2 needs xdist's stable grouped IDs, including late pytest-split changes.
    "pytest-xdist @ git+https://github.com/pytest-dev/pytest-xdist.git@9844b0e1c309780e23103424dc0b5635a3aa5259",
    "psutil>=7.2.2",
    "nox>=2026.10.20",
    "virtualenv>=21.14.13",
    "polars>=2.0.0",
    "sybil>=10.1.0",
    "tach>=0.35.3",
    "vulture>=2.14",
    "hypothesis>=6.170.9",
    "pytest-timeout>=2.4",
    "filelock>=4.2.4",
    "pytest-split>=0.11.0",
    # The mutation runner intentionally depends on mutmut's internal 3.8.0 API.
    "mutmut==3.8.0",
    "pydoclint>=0.11.1",
    "complexipy==8.1.0",
    "pytest-benchmark>=5.3.0",
]
core-test = [
    "pytest>=9.2.0",
    "pytest-xdist @ git+https://github.com/pytest-dev/pytest-xdist.git@9844b0e1c309780e23103424dc0b5635a3aa5259",
    "pytest-timeout>=2.4",
    "hypothesis>=6.170.9",
    "sybil>=10.1.0",
    "tach>=0.35.3",
    "polars>=2.0.0",
    "pandas>=3.0.5,<3.1",
]
warehouse-backends = [
    "ibis-framework[postgres]>=12.0.0",
    # ibis pulls psycopg without a driver; the pure-Python path needs a system
    # libpq, which neither a clean CI image nor a clean checkout has.
    "psycopg[binary]>=3.3.6",
    "ibis-framework[snowflake]>=12.0.0",
    "ibis-framework[bigquery]>=12.0.0",
]
docs = [
    "griffe-pydantic>=1.3.2",
    "mkdocs-material>=9.8.0",
    "mkdocstrings[python]>=1.0.8",
]

[tool.hatch.build.targets.wheel]
packages = ["increment"]

# The sdist ships only what's needed to build the wheel plus licensing and
# readme metadata -- not tests, examples, docs, or repository process notes.
[tool.hatch.build.targets.sdist]
include = [
    "/increment",
    "/README.md",
    "/LICENSE",
    "/NOTICE",
]

# Read versions from git tags and expose installed metadata at runtime; no generated module.
# Archives without git metadata use 0.0.0 as an unknown-version sentinel, not release provenance.
[tool.hatch.version]
source = "vcs"
fallback-version = "0.0.0"

[tool.uv]
package = true
# Keep source-build inputs identical to the reviewed xdist build.
build-constraint-dependencies = [
    "setuptools @ https://files.pythonhosted.org/packages/ef/55/6dc6d6bb953bdfc52519a0059592c52b6e3b8ad51cf8256dffceb55b0610/setuptools-84.2.1-py3-none-any.whl#sha256=ca140b45d5325a9478f880e351484f62fef15f336462e449ca0c03c873d589c2",
    "setuptools-scm[toml] @ https://files.pythonhosted.org/packages/da/f5/54538a1f17ea753c42b0928dc2e62986d463f8c393340b9a1e602f2d4dd9/setuptools_scm-10.3.4-py3-none-any.whl#sha256=82f34c3e3084fc2b57d397200637cc13f2338004052d2fee47baa5f0e902464e",
    "packaging @ https://files.pythonhosted.org/packages/63/34/ba1c580383c9eada3711951fef0795c80b829a078d72188184bcab9dd527/packaging-26.3-py3-none-any.whl#sha256=d7193f7c8e4e93f444fde0262bf90af30e16fa0ad0ad44cb553c87339b23cd1c",
    "vcs-versioning @ https://files.pythonhosted.org/packages/73/1d/ad4064bf12f4503bf61e65d74c93c523672776d25ee0a06aaf42ae09ef3f/vcs_versioning-2.6.0-py3-none-any.whl#sha256=f8bebd1302ebc12e67ceb30fc7dd698ec969414b6fa43b30c3f14ac9b1e72c41",
]

[tool.pytest.ini_options]
# Doc snippets (README.md, docs/) are collected by the root conftest's sybil
# hook but stay out of testpaths: prose integrity is its own tier, not a unit
# test. The `docs_snippets` Nox session runs them in the conditional docs CI job.
testpaths = ["tests"]
markers = [
    "tooling: repository tooling tests; excluded from product tiers and selected by the tooling CI job",
    "integration: exercises cooperating components, local query engines, UI or subprocess boundaries; included in integration-fast and fast, excluded from unit",
    "stress: large-scale or exhaustive deterministic validation; also requires slow and remains in functional-slow until an equivalent required execution gate is activated",
    "slow: expensive functional test; excluded from fast, included in functional-slow unless exhaustive, parameter_recovery, numerical_certification or examples",
    "exhaustive: complete cross-source scenario, matrix and evidence grids and large sweeps; also requires slow; excluded from functional-slow and run by the exhaustive gate on main pushes, nightly and pull requests that change loaders, query, evidence or the parity harness",
    "parameter_recovery: Monte Carlo coverage, bias or recovery study; also requires slow; excluded from fast and functional-slow, run by scientific gates",
    "numerical_certification: deterministic inferential-certification family; also requires slow; excluded from fast and functional-slow, included in scientific certification gates",
    "examples: exercises runnable notebooks end-to-end via real marimo/duckdb subprocesses; always slow-marked too",
    "creates_tables: intentionally leaves new tables on the shared query-test `con` connection; exempts a test from the no-stray-tables guard",
    "compatibility(id): links a test to one exact compatibility scenario rendered in the reference",
    "warehouse_postgres: executes real query builders against a live PostgreSQL connection under integration/warehouse_execution/ -- selected only by the tests_warehouse_postgres nox session, never collected from testpaths",
    "warehouse_snowflake: executes real query builders against a live Snowflake connection under integration/warehouse_execution/ -- selected only by the tests_warehouse_snowflake nox session, never collected from testpaths",
    "warehouse_bigquery: executes real query builders against a live BigQuery connection under integration/warehouse_execution/ -- selected only by the tests_warehouse_bigquery nox session, never collected from testpaths",
    "warehouse_compile: compiles generated warehouse SQL without executing queries; selected only by the tests_warehouse_compile_snowflake and tests_warehouse_compile_bigquery nox sessions",
    "compile_registry: builds the reusable captured warehouse compile registry; selected by the compile-registry CI job",
    "grid(reason): justifies a parametrize expanding past twelve collected items instead of boundary cases plus a Hypothesis property",
    "benchmark: representative migration throughput benchmark",
]
timeout = 300
junit_family = "legacy"
addopts = "-m 'not slow and not parameter_recovery and not numerical_certification and not benchmark'"
filterwarnings = [
    "error",
    # Ibis 12.0.0 calls DuckDB's deprecated fetch method; upstream main uses to_arrow_table().
    # Remove this exact exemption after upgrading to the first stable Ibis release containing that fix.
    "ignore:^fetch_arrow_table\\(\\) is deprecated, use to_arrow_table\\(\\) instead\\.$:DeprecationWarning:^ibis\\.backends\\.duckdb$",
    # Ibis calls the deprecated BigQuery dataframe/Arrow readers directly.
    # Installing pandas-gbq does not help; remove this once Ibis changes its readers.
    "ignore:.* via google-cloud-bigquery(-storage)? is deprecated\\.:PendingDeprecationWarning",
    # Snowflake's vendored TLS stack calls the deprecated X509 accessor.
    # Remove this exemption once the connector no longer uses that path.
    "ignore:^X509\\.get_subject is deprecated:DeprecationWarning",
]

[tool.ty.src]
include = ["increment", "tests", "calibration", "scripts"]

# Docstrings must match signatures. Existing mismatches are frozen in the
# baseline; lint fails on a new one, and on a fixed one still listed there.
[tool.pydoclint]
style = "numpy"
baseline = "pydoclint-baseline.txt"
auto-regenerate-baseline = false
quiet = true
# Model fields are documented as Parameters; attribute lists would pin every field.
check-class-attributes = false

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["notebooks"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "C901",    # complexity shape
    "PLR0913", # public signature shape
    "PLR0915", # statement-count shape
    "FBT001",  # boolean positional shape
    "FBT002",  # boolean default shape
    "RUF100",  # marker validity
]
ignore = [
    "E501",  # line too long (handled by line-length)
    "E741",  # ambiguous variable names
]

# Initial shape baseline flags complexity at 25+; tightening toward 15 is a config bump plus marker pass.
# PLR0912/PLR0911/FBT003 stay off: branch fan-out duplicates C901; early-return guards are established.
[tool.ruff.lint.mccabe]
max-complexity = 24

[tool.ruff.lint.pylint]
max-statements = 60
max-args = 12

[tool.ruff.lint.per-file-ignores]
# Marimo cells are generated `_` functions, so per-function shape metrics are noise.
"examples/*.py" = ["B018", "C901", "PLR0913", "PLR0915", "FBT001", "FBT002"]
# Test helpers legitimately take flag arguments; the boolean-trap gate targets the library API surface.
"tests/*" = ["FBT001", "FBT002"]
"vulture_whitelist.py" = ["F821", "B018"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

[tool.mutmut]
source_paths = ["increment"]
only_mutate = [
    "increment/estimation/armstats.py",
    "increment/estimation/variance.py",
    "increment/estimation/_tails.py",
    "increment/estimation/meta.py",
    "increment/estimation/quantile.py",
    "increment/power/_validation.py",
]
pytest_add_cli_args_test_selection = [
    "tests/estimation/test_armstats.py",
    "tests/estimation/test_variance.py",
    "tests/estimation/test_tails.py",
    "tests/estimation/test_meta.py",
    "tests/estimation/test_quantile.py",
    "tests/power/",
]
also_copy = ["docs/guides", "examples"]
pytest_add_cli_args = ["-x", "-q"]
# mutmut owns process isolation; project addopts still apply the fast-tier marker.
process_isolation = "fork"
# On fork-unsafe numerical stacks, use scripts/mutation_campaign.py instead
# of the mutmut CLI directly: it runs each stage in a fresh interpreter.
