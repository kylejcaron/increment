[project]
name = "increment"
dynamic = ["version"]
description = "Coming soon"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Kyle Caron", email = "kyle.j.caron@gmail.com" }]
requires-python = ">=3.12,<3.15"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.14",
]
classifiers = [
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

# Required. Without this table PEP 517 falls back to setuptools, which ignores
# every [tool.hatch.*] table below -- the wheel builds "successfully" as
# version 0.0.0 with no vcs-derived version at all.
[build-system]
requires = ["hatchling>=1.31", "hatch-vcs>=0.5"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["increment"]

[tool.hatch.version]
source = "vcs"

[tool.uv]
package = true

[tool.ty.src]
include = ["increment", "tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by line-length)
    "E741",  # ambiguous variable names
]

[tool.ruff.lint.per-file-ignores]
# marimo cells render their final bare expression -- that is the display
# mechanism, not a mistake flake8-bugbear's B018 is right to flag elsewhere.
"examples/*.py" = ["B018"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
