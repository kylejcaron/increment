# Hook scopes are intentionally per-hook: source tooling stays focused while
# repository-wide artifact checks still see every added file.

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.0
    hooks:
      - id: ruff-check
        types_or: [python, pyi]
        args: ["--fix", "--output-format=full"]
        stages: [pre-commit, pre-push]
      - id: ruff-format
        types_or: [python, pyi]
        stages: [pre-commit, pre-push]
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        files: &scoped_files |
          (?x)^(
            increment/.*
            |tests/.*
            |scripts/.*
            |integration/.*
            |calibration/.*
            |conftest\.py
            |docs/.*\.py
            |examples/.*\.ya?ml
            |\.github/.*\.ya?ml
            |noxfile\.py
            |pyproject\.toml
            |\.pre-commit-config\.yaml
            |Makefile
            |vulture_whitelist\.py
          )$
      - id: end-of-file-fixer
        files: *scoped_files
      - id: check-toml
        files: *scoped_files
      - id: check-yaml
        files: *scoped_files
      - id: debug-statements
        files: *scoped_files
      # This hook intentionally has no file scope: every added artifact is
      # subject to the size limit.
      - id: check-added-large-files
  # Type-checking uses the Nox session so hooks install every optional
  # integration dependency before checking the complete repository.
  - repo: local
    hooks:
      - id: ty-check
        name: ty check
        entry: uv run --with nox nox -s typecheck
        language: system
        pass_filenames: false
        stages: [pre-commit, pre-push]
      - id: prose-audit
        name: comment and docstring prose audit
        entry: uv run python scripts/audit_verbosity.py --gate
        language: system
        types: [python]
      - id: test-weakening
        name: test weakening check
        entry: "bash -c 'uv run --no-sync python -m scripts.check_test_weakening --base $(git merge-base origin/main HEAD) || { echo WARNING: test-weakening report requires review; CI enforces PR label; exit 0; }'"
        language: system
        stages: [pre-push]
        pass_filenames: false
        always_run: true
      - id: prepush-tests
        name: pre-push unit tests
        entry: uv run --no-sync --with pytest-testmon==2.2.0 python -m scripts.prepush_tests
        language: system
        stages: [pre-push]
        pass_filenames: false
        always_run: true
